川野菊綺互亭千葉朩犀浙江觀潮羣仙繪幅樓觀月桂隱攀桂杏花莊雞冠黃葵九月重九登城把茰把菊亭采菊蘇堤看芙蓉珍林嘗時果景全軒金橘芙蓉池三色拒霜杏花莊篘新酒十月現樂堂暖爐滿霜亭蜜橘煙波館買市賞小春花杏花莊挑虀詩禪堂試香十一月摘星軒枇杷花冬至節餛飩味空亭蠟梅蒼寒堂南天竹花院水仙羣仙繪幅樓前觀雪十二月綺互亭檀香蠟梅天街關市南湖賞雪安間堂試燈湖山探梅花院蘭花瀛巒勝處觀雪二十四夜餳果玉照堂看早梅除夜守嵗約齋桂隱百果淳熙丁未秋余捨所居為梵剎爰命桂隱堂館橋池諸名各賦小詩總八十餘首逮慶元庚申厯十有四年之久匠生於心指隨景變移徙更葺規模始全因刪易增補得詩凡數百綱舉而言之東寺為報上嚴先之地西宅為安身攜幼之所南湖則管領風月北園則娛宴賔親亦菴神居植福以資靜業也約齋晝處觀書以助老學也至於暢懷林泉登賞吟嘯則又有衆妙峰山包羅幽曠介於前六者之間區區安身嗜靜之志造物亦不相負矣或問豫曰造物不負子子其惡負造物者哉釋名宦之拘囚享天真之快樂要當於筋骨未衰時今子三仕中朝顛華齒墜涉筆總無十二旬如之何則可余應之曰仕雖多不使勝間日余之願也余之幸也敢不勉旃壬戌嵗仲夏張鎡功父書東寺敕賜廣夀慧雲大雄尊閣千佛像靜高堂寢室真如軒種竹西宅叢奎閣安奉被賜四朝宸翰德勳堂祖廟以高宗御書二字名儒聞堂前堂用告詞取名現樂堂中堂用朱巖壑語安間堂後堂瀛巒勝處東北小堂前後山水綺互亭有四小軒栁堂花院應鉉齋筮得鼎卦故名振藻取告詞中字名宴頤軒尚有軒賞真亭山水亦菴法寶千塔鐵鑄千塔藏經千卷如願道場藥師佛壇傳水軒寫經寮書華嚴大乘諸經約齋泰定軒煙波觀南湖御風橋十間閬春堂牡丹芍藥把菊亭天鏡亭水心星槎舟名鷗渚亭泛月閣水門北園羣仙繪幅樓前後十一間下臨丹桂五六十株盡見江湖諸山桂隱諸處總名今揭樓下清夏堂玉照堂梅花四百株蒼寒堂青松二百株艷香館雜春花百餘槮碧宇修竹十畝水北書院對山臨溪界華精舍夢中得名撫鶴亭近松株芳草亭臨池味空亭蠟梅垂雲石髙二丈廣十四尺攬月橋飛雪橋在梅林中蕊珠洞荼䕷二十五株涉趣門總門入松徑珍林雜果小園杏花莊村酒店安樂泉竹間井芙蓉池紅蓮十畝四面種芙蓉鵲泉井名衆妙峰山詩禪堂黃寧洞天景白軒置香山畫像并文字書葉軒柿二十株緑畫軒木犀臨側文光軒臨池俯窠軒高檜旁無所要軒長不昧軒摘星軒餐霞軒櫻桃三十餘株讀易軒詠永軒道德經凝薰堂楚佩亭蘭宜雨亭千葉海棠二十株夾流水滿霜亭橘五十餘株聽鶯亭千嵗菴仁皇飛白字恬虗菴憑暉亭美芝亭都徽别館誦度人經處乃徽宗御書水湍橋漪嵐洞施無畏觀音銅像澄霄臺西東登嘯臺金竹巖隱書巖有五仙書在巖穴中可望不可取古雪巖新巖疊翠亭茂林中容十餘人坐釣磯菖蒲澗上有小石橋中池養金魚在山澗中珠旒瀑藏丹谷煎茶磴右各有詩在集中此不繫録武林舊事卷十欽定四庫全書武林舊事卷十下宋周密撰棊待詔鄭日新越重吳俊臣安吉具施茂施猢猻朱鎮章先杜黃象徐彬象林茂象禮重象尚端沈姑姑女流象金四官人上官夫人象王安哥象李黑子象書會李霜涯作賺絶倫李大官人談詞葉庚周竹窗平江周一郎猢猻賈草二郎演史喬萬卷許貢士張解元周八官人檀溪子陳進士陳一飛陳三官人林宣教劉進士鞏八官人徐繼先穆書生戴書生張小娘子宋小娘子陳小娘子李黑子陸進士丘機山説經長嘯和尚彭道名法和陸妙慧女流余信庵陸妙靜女流周春辨和尚達理和尚嘯菴隱秀借菴保菴戴悅菴息菴混俗許安然有緣戴欣菴小説蔡和李公佐小張四郎朱修德夀宮孫竒德夀宮任辨御前施主御前葉茂御前方端御前劉和御前王辨鐵衣親兵盛顯王琦陳良王班直洪翟四郎升粥張二許濟張黑踼俞住菴包頭陳琳泰州張顯酒李一郎國林喬宣王四郎明王十郎國林王六郎師古胡十五郎彬故衣毛三倉張三棗兒徐榮徐保義汪保義張柏張訓沈佺沈喎湖水周熝肝未掇絛張茂王三教徐茂象牙孩兒王主管翁彥嵇元陳可菴林茂夏達明東王夀白思義史惠英女流影戲賈震賈堆三賈賈偉尚保義三伏伏大伏二伏三沈顯陳松馬俊馬進王三郎升朱祐蔡咨張七周端郭真李二娘隊戲王潤興女流黑媽媽唱賺濮三郎扇李二郎郭四郎孫端葉端牛端華琳黃文質盛三郎碩和蠟燭馬升熊春梅四汪六沈二王六許曽三邵六小王三媳婦徐沈七謝一圭小唱蕭婆婆韓太師府賀夀陳尾犯畫魚周陸思顯都管笙張周頤齋仵都事丁八丁未年撥入勾欄弟子嘌唱賺色施二娘時春春時住住何總憐童二嚴偏頭白大鼻葛四徐勝勝耿四朱安安陳伴伴火虎頭余元元錢寅奴鼓板段防禦捨生張眼光張開張驢兒謂之三張陳宣娘陳喜生拍周雙頂潘小雙陳喜莫及笛來七笛董大有金四札子皮朱關生雜劇趙泰慢星子女流王侯喜宋邦寧唐都管世榮三何晏喜晏清晏然鋤頭段唧伶頭諸國朝宋朝清王太鐵立郝成小鍬宋喜宋國珍趙恩王太吳師賢朱太豬兒頭王見喜鐵太馮舜朝王珍美吳國賢鄭太惠恩澤時和顔喜蕭金蓮一窟王時豐稔時國昌金寶趙祥吳國昌王吉王雙蓮沈小橋杜太雜扮鐵刷湯江魚頭兔兒頭菖蒲頭眼裏喬胡蜀葵迎春繭卓郎婦笑靨兒科頭扮韻梅頭小菖蒲金魚兒銀魚兒胡小俏周喬鄭小俏魚得水旦王道大王夀香旦厲太顧小喬陳橘皮小橘皮菜市喬自來俏彈唱因緣童道費道蔣安居陳遂李道沈道顧善友甘道俞道俞康孫張道唱京詞蔣郎婦孟客吳郎婦馬客諸宫調傳竒高節婦黃淑卿王雙蓮逺本道唱耍令