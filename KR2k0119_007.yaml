body:
  text: 武林舊事卷七宋周密撰德夀宫起居注乾道三年三月初十日南內遣閣長至德夀宫奏知連日天氣甚好欲一二日間恭邀車駕幸聚景園看花出自聖意選定一日太上云傳語官家備見聖孝但頻頻出去不惟費用又且勞動多少人本宫後園亦有幾株好花不若來日請官家過來間看遂遣提舉官同到南內奏過遵依訖次日進早膳後車駕與皇后太子過宫起居二殿訖先至燦錦亭進茶宣召吳郡王曽兩府以下六員侍宴同至後苑看花兩廊並是小內侍及幕士效學西湖鋪放珠翠花朵玩具匹帛及花籃閙竿市食等許從內人關撲次至毬場看小內侍拋綵毬蹴鞦韆又至射廳看百戲依例宣賜回至清妍亭看荼䕷就登御舟繞堤間逰亦有小舟數十隻供應雜藝嘌唱鼓板蔬果與湖中一般太上倚闌間看適有雙燕掠水飛過得旨令曽覿題詞遂賦進阮郎歸云栁陰庭院占風光呢喃春晝長碧波新漲小池塘雙雙蹴水忙萍散漫絮飛揚輕盈體態狂為憐流水落花香銜將歸畫梁既登舟知閣張掄進栁梢青云栁色初濃餘寒似水纎雨如塵一陳東風縠紋微皺碧沼鱗鱗仙娥花月精神奏鳳管鸞絃鬭新萬嵗聲中九霞杯內長醉芳春曽覿和進云桃靨紅勻梨腮粉薄鴛徑無塵鳳閣淩虛龍池澄碧芳意鱗鱗清時酒聖花神看內苑風光又新一部仙韶九重鸞仗天上長春各有宣賜次至靜樂堂看牡丹進酒三盞太后邀太皇官家同到劉婉容位奉華堂聽摘阮奏曲罷婉容進茶訖遂奏太后云近教得二女童瓊華綵華並能琴阮下棊寫字畫竹背誦古文欲得就納與官家則劇遂令各呈伎藝并進自製阮譜三十曲太后遂宣賜婉容宣和殿玉軸沈香槽三峽流泉正阮一面白玉九芝道冠北珠緣領道氅銀絹三百匹兩會子三百萬貫是日三殿並醉酉牌還內自此官裏知太上聖意不欲頻出勞人遂奏知太上命修內司日下於北內後苑建造冷泉堂疊巧石為飛來峰開展大池引注湖水景物並如西湖其西又建大樓取蘇軾詩句名曰聚逺並是今上御名恭書又御製堂記太上賦詩今上恭和刻石堂上是嵗翰苑進端午帖子云聚逺樓前靣靣風冷泉堂下水溶溶人間炎熱何由到真是瑤臺第一重又曰飛來峰下水泉清臺沼經營不日成境趣自超塵世外何須方士覔蓬瀛蓋紀實也淳熙三年五月二十一日天申聖節先十日駕詣德夀宫進香並進奉銀五萬兩絹二十匹錢五萬貫度牒一百道用緑油匣二百箇上貼簽云臣某御名謹進令幕士安頓寢殿前候閣長到宫移入殿上并鋪放七寶金銀器皿等十二日皇后到宫進香排日皇太子皇太子妃并大內職典等進香至日卯時車駕率皇太子太子妃文武百僚並詣宫上夀車駕至小次降輦太上遣本宮提舉傳旨減拜行禮上回奏云上感聖恩容臣依禮上夀太上再命減十拜俟太上升殿皇帝起居拜舞如儀併率皇太子百官奉上御酒樂作衛士三呼駕興入幄次小歇樂人再排立殿上降簾太上再坐太后率皇后太子妃上夀六宫次第起居禮畢退上侍太上過寢殿進早膳太上令宣喚吳郡王等官前來伴話上侍太上同往射廳看百戲依例宣賜再入幄次小歇上遣閣長奏知太上午時三刻恭請赴坐至期車駕並赴德夀殿排當自皇帝以下並簪花侍宴至第三盞太上遣內侍請官家免花帽束帶並卸上蓋衣官裏回奏上感聖恩并免皇后頭冠皇太子穿執並謝恩訖太上泛賜皇太子纍金嵌寶盤盞紫羅紫紗南北內互賜承應人目子錢主管禁衛官率禁衛等人於殿門外謝恩又入幄次小歇約二刻再請太上往至樂堂再坐教坊大使申正德進新製萬嵗興龍曲樂破對舞各賜銀絹有差又移宴清華看蟠松宮嬪五十人皆仙妝奏新樂進酒并衙前呈新藝約至五盞太上賜官裏御書急就章并金剛經官家却進御書真草千文太上看了甚喜云大哥近日筆力甚進上起謝同皇太子步至蟠松下看御書詩再入坐太上皇索翡翠鸚鵡杯官裏與皇后親捧杯進酒太上曰此是宣和間外國進到可以屑金就以為賜上謝恩時太上官家並巳七八分醉再服上蓋率皇后太子謝恩宣平輦近裏升輦太上宣諭知省云官家巳醉可一路小心照管知省等領聖旨還內來早上遣知省至宫恭問二聖起居并奏欲親到宫謝恩太上就令提舉往問興居并免到宮行禮八月二十一日夀聖皇太后生辰先十日車駕過宮先至太上處起居方至本殿進香次皇后皇太子太子妃莊文太子妃張娘娘以下並進香起居上至太上內書院進泛索遂奏安止還內十二日婉容到宮至西便門廊下先至太上處奏起居次入本殿進香值雨免下階起居大內進香十三日知省及大官到宫進香閣長就管押進奉銀絹度牒等并七寶金銀器皿比天申節減半并珠子十號並於後殿鋪放十六日本殿提舉率本宮官屬進香并設放夀星及神仙意思書畫等物隔簾奏喏免起居退次日皇太后宅親屬到宫進香并本宫人吏後苑官屬作院使臣等並節次進香二十一日卯時皇后先到宫候駕到至太上前殿起居次至本殿官家第一班皇后第二班太子并太子妃第三班上夀訖太后宅親屬上夀並同天申節儀太上邀官裏至清心堂進泛索值雨不呈百戲依例支賜午初二刻奏辦就本殿大堂靣北坐官家花帽兒上蓋皇后三叉頭冠並賜簪花至五盞並免大衣服官裏便背兒赴坐第七盞小劉婉容進自製十色菊千秋嵗曲破內人瓊瓊柔柔對舞上於閣子庫取賜五兩珠子一號細色北段各十匹太后又賜七寶花十枝珠翠芙蓉領緣一副又移坐靈芝殿有木犀處進酒次到至樂堂再坐更盡後還內十月二十二日今上皇帝會慶聖節至日車駕過宮太上升殿起居訖簪花拜舞進夀酒訖太上回賜夀酒次至太后殿行禮詳並見第一卷從太上至後苑梅坡看早梅又至浣溪亭看小春海棠午初至載欣堂排當官家換素帽兒太后賜官裏女樂二十人上再拜謝恩并教坊都管王喜等進新製會慶萬年薄媚曲破對舞並賜銀絹太上以白玉桃杯賜上御酒云學取老爹年紀早早還京上飲酒再拜謝恩三盞後官家換背兒免拜皇后換團冠背兒太子免繫裹再坐本宫御侍六人并升郡夫人就賜誥謝恩并照例支散目子錢太上又賜官裏玉酒器十件纍珠嵌寶器皿一千兩克絲作金龍裝花軟套閣子一副侍宴官吳郡王以下各賜金盤盞匹段并薇露酒香茶等是日官裏大醉申後宣逍遙子入便門升輦還內淳熙五年二月初一日上過德夀宫起居太上留坐冷泉堂進泛索訖至石橋亭子上看古梅太上曰苔梅有二種宜興張公洞者苔蘚甚厚花極香一種出越上苔如緑絲長尺餘今嵗二種同時著花不可不少留一觀上謝曰恭領聖旨上皇因言多日不見史浩命內侍宣召既至起居訖賜坐并召居廣鄭藻初筵教坊奏樂呈伎酒三行太上宣索市食如李婆婆雜菜羮賀四酪靣三臟豬胰胡餅戈家甜食等數種太上笑謂史浩曰此皆京師舊人各厚賜之史起謝又移宴靜樂堂盡遣樂工全用內人動樂且用盤架品味百餘種酒行無算又宣索黃玉紫心葵花大盞太上親自宣勸史捧觴為兩宮夀時君臣皆巳霑醉小內侍密語史相公云少酌上聞之曰滿酌不妨當為老先生一醉太上極喜賜史少保玉帶一條氷片腦子一金合紫泥羅二十匹御書四軸史相謝恩退淳熙六年三月十五日車駕過宫恭請太上太后幸聚景園次日皇后先到宫起居入幕次換頭面候車駕至供泛索訖從太上太后至聚景園太上太后至會芳殿降輦上及皇后至翠光降輦並入幄次小歇上邀兩殿至瑶津少坐進泛索太上太后並乘步輦官裏乘馬遍逰園中再至瑶津西軒入御筵至第三盞都管使臣劉景長供進新製泛蘭舟曲破吳興祐舞各賜銀絹上親捧玉酒船上夀酒酒滿玉船船中人物皆能舉動如活太上喜見顔色散兩宫內官酒食并承應人目子錢遂至錦壁賞大花三面漫坡牡丹約千餘叢各有牙牌金字上張碧油絹幕又别剪好色樣一千朵安頓花架並是水晶玻璃天晴一作天青汝窑金瓶就中間沈香卓兒一隻安頓白玉碾花商尊約髙二尺徑二尺三寸獨插照殿紅十五枝進酒三杯一應隨駕官人內官並賜兩面翠葉滴金牡丹一枝沈香柄金絲御書扇各一把是日知閣張掄進壺中天慢云洞天深處賞嬌紅輕玉髙張雲幕國艷天香相競秀瓊苑風光如昨露洗妖妍風傳馥郁雲雨巫山約春濃如酒五雲臺榭樓閣聖代道洽功成一塵不動四境無鳴柝屢有豐年天助順基業增隆山嶽兩世明君千秋萬嵗永享升平樂東皇呈瑞更無一片花落太上喜賜金杯盤法錦等物此詞或謂是康伯可所賦張掄以為已作又進酒兩盞至清輝少歇至翠光登御舟入裏湖出斷橋又至真珠園太上命買湖中龜魚放生并宣喚在湖買賣等人內侍用小綵旗招引各有支賜時有賣魚羮宋五嫂對御自稱東京人氏隨駕到此太上特宣上船起居念其年老賜金錢十文銀錢一百文絹十匹仍令後苑供應泛索時從駕官丞相趙雄樞密使王淮參政錢良臣並在顯應觀西齋堂侍班各賜酒食翠花扇子至申時御舟梢泊花光亭至會芳少歇時太上已醉官裏親扶上船並乘轎兒還內都人盡出觀曕贊嘆聖孝九月十五日明堂大禮十三日值雨未時奏請宿齋北內送天花蘑菰蜜煎山藥棗兒乳糖巧炊火燒角兒等十四日早車駕詣景靈宫回太廟宿齋雨終日不止午後太上遣提舉至太廟傳語官家連日祀事不易所有十六日詣宫飲福以陰雨泥濘勞頓可免到宫行禮天氣陰寒請官家善進御膳頻添御服聖旨遣閣長回奏上感聖恩至日若登樓肆赦時依舊詣宫行禮若值雨不登門時續當奏聞至晚雨不止宣諭大禮使趙雄來早更不乘輅止用逍遙輦詣文德殿致齋一應儀仗排立並行放免從駕官並常服以從併遣御藥奏聞北內來日為值雨更不乘輅謹遵聖旨更不過宫行飲福禮太上令傳語官家既不乘輅此間也不出去看也大禮使趙雄雖已得旨猶不許放散上聞之曰來早若不晴時有何面目雄聞之曰縱使不晴得罪不過罷相耳堅執不肯放散至黃昏後雨止月明上大喜遣內侍李思恭宣諭大禮使仍舊乘輅再遣御藥奏聞北內以天晴仍舊乘輅候登門肆赦訖詣宫行飲福禮十五晴色甚佳車駕自太廟乘輅還內日映御袍天顔甚喜都民皆贊嘆聖德至巳時太上直閣子官往齋殿傳語官家且喜晴明可見誠心感格賜御用段匹玉鞭轡七寶篦刀子事件素食果子等仍奏連日勞頓免行飲福禮上就遣知省回奏上感聖恩天氣轉晴皆太上皇帝聖心感格容肆赦訖過宮行禮并謝聖恩十六日登門肆赦畢車駕詣宫小次降輦提舉傳太上聖旨特減八拜仍至夀聖處飲福禮畢略至絳華堂進泛索知閣張掄進臨江仙詞云聞道彤庭森寶仗霜風逐雨驅雲六龍扶輦下青冥香隨鸞扇逺日映赭袍明簾捲天街人頂戴滿城喜氣氤氲等間散作八荒春祇知天意好昨夜月華新淳熙七年十二月二十八日南內遣御藥并後苑官管押進奉兩宫守嵗合食則劇金銀錢消夜嵗軸果兒錦厯鍾馗爆仗羔兒法酒春牛花朵等就奏知太上皇帝元日欲先進宮朝賀然後還內引見大金人使太上不許傳語官家至日可先引見人使訖却行到宫淳熙八年元日上坐紫宸殿引見人使訖即率皇后皇太子太子妃至德夀宫行朝賀禮詳見第一卷并進呈畫本人使靣貌姓名及館伴問答是嵗太上聖夀七十有五舊嵗欲再行慶夀禮太上不許至是乃密進黃金酒器二千兩上侍太上於欏木堂香閣內説話宣押棊待詔并小説人孫竒等十四人下棊兩局各賜銀絹供泛索訖官家恭請太上太后來日就南內排當初二日進早膳訖遣皇太子到宫恭請兩殿並只用轎兒禁衛簇擁入內官家親至殿門拱迎親扶太上降輦至損齋進茶次至清燕殿間看書畫玩器約午時初後苑恭進酥酒十色熬煮午正三刻就凌虛排當三盞至萼緑華堂看梅上進銀三萬兩會子十萬貫太上云此無用錢處不須得上再三奏請止受三分之一未初雪大下正是臘前太上官家甚喜云今年正欠些雪可謂及時太上云雪却甚好但恐長安有貧者上奏云已令有司比去年倍數支散矣太上亦命提舉官於本宫支撥官會照朝廷數目發下臨安府支散貧民一次又移至明逺樓張燈進酒節使吳琚進喜雪水龍吟詞云紫皇髙宴簫臺雙成戲擊瓊包碎何人為把銀河水剪甲兵都洗玉樣乾坤八荒同色了無塵翳喜氷消太液暖融鳷鵲端門曉班初退聖主憂民深意轉鴻鈞滿天和氣太平有象三宫二聖萬年千嵗雙玉杯深五雲樓迥不妨頻醉細看來不是飛花片片是豐年瑞上大喜賜鍍金酒器二百兩細色段匹復古殿香糕兒酒等太后命本宫歌板色歌此曲進酒太上盡醉至更後宣轎兒入便門上親扶太上上輦還宫淳熙九年八月十五日駕過德夀宫起居太上留坐至樂堂進早膳畢命小內侍進綵竿垂釣上皇曰今日中秋天氣甚清夜間必有好月色可少留看月了去上恭領聖旨索車兒同過射廳射弓觀御馬院使臣打毬進市食看水傀儡晚宴香逺堂堂東有萬嵗橋長六丈餘並用吳璘進到玉石甃成四畔雕鏤欄檻瑩徹可愛橋中心作四靣亭用新羅白羅朩蓋造極為雅潔大池十餘畝皆是千葉白蓮凡御榻御屏酒器香奩器用並用水晶南岸列女童五十人奏清樂北岸有芙蓉岡一帶並是教坊工近二百人待月初上簫韶齊舉縹眇相應如在霄漢既入座樂少止太上召小劉貴妃獨吹白玉笙霓裳中序上自起執玉杯奉兩殿酒并以纍金嵌寶注碗杯柈等賜貴妃侍宴官開府曽覿恭上壺中天慢一首云素飈揚碧看天衢穩送一輪明月翠水瀛壺人不到比似世間秋别玉手瑶笙一時同色小按霓裳疊天津橋上有人偷記新闋當日誰幻銀橋阿瞞兒戲一笑成癡絶肯信羣仙髙宴處移下水晶宫闕雲海塵清山河影滿桂冷吹香雪何勞玉斧金甌千古無缺上皇曰從來月詞不用金甌事可謂新竒賜金束帶紫番羅水晶注碗一副上亦賜寶盞古香至一更五點還內是夜隔江西興亦聞天樂之聲淳熙十年八月十八日上詣德夀宫恭請兩殿往浙江亭觀潮進早膳訖御輦簷兒及內人車馬並出候潮門先命修內司於浙江亭兩旁㧓縛席屋五十間至是並用綵纈幕㡩得旨從駕百官各賜酒食並免侍班從便觀看先是澉浦金山都統司水軍五千人抵江下至是又命殿司新刺防江水軍臨安府水軍並行閲試軍船擺布西興龍山兩岸近千隻管軍官於江靣分布五陳乘騎弄旗標槍舞刀如履平地點放五色煙炮滿江及煙收炮息則諸船盡藏不見一隻奉聖旨自管軍官以下並行支犒一次自龍山以下貴邸豪民綵幕凡二十餘里車馬駢闐幾無行路西興一帶亦皆㧓縛幕次綵繡照江有如鋪錦市井弄水人如僧兒留住等凡百餘人皆手持十幅綵旗踏浪爭雄直至海門迎潮又有踏混木水傀儡水百戲撮弄等各呈伎藝並有支賜太上喜見顔色曰錢塘形勝東南所無上起奏曰江潮亦天下所獨有也太上宣諭侍宴官令各賦酹江月一曲至晚進呈太上以吳琚為第一其詞云玉虹遙挂望青山隱隱一眉如抹忽覺天風吹海立好似春霆初發白馬凌空瓊鰲駕水日夜朝天闕飛龍舞鳳鬱蔥環拱吳越此境天下應無東南形勝偉觀真竒絶好是吳兒飛綵幟蹴起一江秋雪黃屋天臨水犀雲擁看擊中流楫晚來波靜海門飛上明月兩宮並有宣賜至月上還內淳熙十一年六月初一日車駕過宫太上命提舉傳旨盛暑請官家免拜至內殿起居太上令小內侍扶掖免拜謝恩太后處亦免拜太上邀官裏便背兒至冷泉堂進早膳訖太上宣諭云今嵗比常年熱甚上起答云伏中正要如此太上云今日且留在此納涼到晚去或三省有緊切文字不妨就幄次進呈上領聖旨遂同至飛來峰看放水簾時荷花盛開太上指池心云此種五花同幹近伯圭自湖州進來前此未見也堂前假山修竹古松不見日色並無暑氣後苑小厮兒三十人打息氣唱道情太上云此是張掄所撰鼓子詞後苑進沆瀣漿雪浸白酒上起奏曰此物恐不宜多喫太上曰不妨反覺爽快上曰畢競傷脾太上首肯因間説宣和間公公每遇三伏多在碧玉壺及風泉館萬松莊等處納涼此處涼甚每次侍宴雖極暑中亦著納襖兒也命小內侍宣張婉容至清心堂撫琴并令棊童下棊及令內侍投壺賭賽利物則劇官家進水晶提壺連索兒可盛白酒二斗白玉雙蓮杯柈碾玉香脫兒一套六箇大金盆一面盛七寶水戲并宣押趙喜等教舞水族又進太皇后白玉香珀扇柄兒四把龍涎香數珠佩帶五十副真珠香囊等物直至酉初還內武林舊事卷七
