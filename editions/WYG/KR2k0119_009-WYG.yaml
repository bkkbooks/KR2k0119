body:
  text: 武林舊事巻九宋周宻撰髙宗幸張府節次畧紹興二十一年十月髙宗幸清河郡王第供進御筵節次如後安民靖難功臣太傅静江軍武靖海軍節度使醴泉觀使清河郡王臣張俊進奉繡花髙飣一行八果罍香圓真柑石榴橙子鵞梨乳梨榠查花朩瓜樂仙乾果子义袋兒一行荔枝圓眼香蓮榧子榛子松子銀杏梨肉棗圈蓮子肉林禽旋大蒸􅀥鏤金香藥一行腦子花兒甘草花兒硃砂圓子朩香丁香水龍腦史君子縮砂花兒官桂花兒白术人參橄欖花兒彫花蜜煎一行彫花梅球兒紅消兒彫花筍蜜冬𤓰魚兒彫花紅團花朩瓜大段兒彫花金橘青梅荷葉兒彫花薑蜜筍花兒彫花橙子木瓜方花兒砌香酸鹹一行香藥朩𤓰椒梅香藥藤花砌香櫻桃砌香萱草拂兒紫蘇柰香砌香葡萄甘草花兒梅肉餅兒薑絲梅水紅薑雜絲梅餅兒脯腊一行線肉條子皂角鋌子蝦腊雲夢􅘣兒肉腊妳房旋􅑕金山鹹豉酒腊肉垂手八盤子棟蜂兒番葡萄香蓮事件念珠巴欖子大金橘新椰子象身板小橄欖榆柑子再坐切時果一行春藕甘蔗紅柿鵞梨餅子切橙子切緑橘乳梨月兒生藕鋌兒時新果子一行金橘葴楊梅新羅葛切蜜簟切脆橙榆柑子新椰子切宜母子甘蔗柰香梨五花兒藕鋌兒新柑子彫花蜜煎一行同前砌香鹹酸一行同前荔枝甘露餅荔枝寥花茘枝好郎君龍纒桃條酥胡桃纒棗圈纒梨肉香蓮事件香藥蒲萄纒松子糖霜玉蜂兒白纒桃條脯腊一行同前下酒十五盞第一盞花炊鵪子荔枝白腰子第二盞妳房簽三脆羮第三盞羊舌簽萌芽肚胘第四盞肫掌簽鵪子羮第五盞肚胘膾鴛鴦煠肚第六盞沙魚膾炒沙魚襯湯第七盞鱔魚炒鱟鵞肫掌湯虀第八盞螃蟹釀棖妳房玉蕋羮第九盞鮮蝦蹄子膾第十盞洗手蟹第十一盞五珍膾第十二盞第十三盞第十四盞第十五盞插食炒白腰子炙肚胘炙鵪子脯潤雞潤兔炙炊餅不炙炊餅臠骨勸酒果子庫十番砌香果子雕花蜜煎時新果子獨裝巴欖子裝大金橘小橄欖鹹酸蜜煎獨裝新椰子對裝揀松畨葡萄四色時果對裝春藕陳公梨厨勸酒一味江􅠪煠肚江􅠪生蝤蛑簽薑醋香螺香螺煠肚薑酸假公權煨壯蠣牡蠣煠肚蟑蚷煠肚凖備上細罍四卓又次細罍二卓内蜜煎鹹酸時新脯腊等對食十盞二十分蓮花鴨簽蠒兒羮三珍膾南炒鱔水母膾鵪子羮鯚魚膾三脆羮洗手蟹煠肚胘對展毎分時果五盤兒知省御帯御藥門司直殿官晚食五十分名件二色蠒兒肚子羮笑靨兒脯鴨小頭羮餅脯腊雞直殿官大煠下酒鴨簽水母膾鮮蝦蹄子羮糟蟹野鴨五珍膾紅生水晶膾蛤蜊羮直殿官合子食脯雞油包兒二色薑豉野鴨雜熝入糙雞麻脯雞臓煉魚炙魚片羊頭菜羮一胡蘆直殿官果子時果十隔楪凖備薛方瓠羮備辦外官食炙第一等並簇送太師尚書左僕射同中書門下平章事秦檜燒羊一口滴粥燒餅食十味大碗百味羮餻兒盤勸簇五十饅頭血羮燒羊頭雙下雜簇從食五十事肚羮雙下火膀子羊舌託胎羮三脆羮鋪羊粉飯大簇飣鮓餻鵪子蜜煎三十楪時果一合切榨十楪酒三十瓶少保觀文殿大學士秦熺燒羊一口滴粥燒餅食十味蜜煎一合時果一合切榨酒十瓶第二等㕘知政事余若水簽書樞宻巫伋少師恭國公殿帥楊存中大尉兩府吴益普安郡王恩平郡王各食十味蜜煎一合切榨一合燒羊一盤酒六瓶第三等侍從七員左朝散郎禮部侍郎兼權吏部尚書陳誠之左中大夫刑部侍郎兼權吏部侍郎韓仲通右承議郎權吏部侍郎李如岡右奉議郎起居舎人湯思退右朝散大夫太府卿兼户部侍郎徐宗説右宣教郎樞宻院檢詳諸房文字兼兵部侍郎陳相右宣教郎中書門下省檢正諸房公事兼給事中陳䕫管軍二員馬軍太尉成閔步軍太尉趙宻知閤六員保信軍節度使領閤門使兼客省四方館事提㸃皇城司鄭藻昭化軍承宣使領閤門使兼客省四方館事提㸃皇城司錢成州團練使領閤門事兼客省四方館事提㸃皇城司趙愷貴州團練使領閤門事兼客省四方館事提㸃皇城司宋武節大夫吉州刺史領閤門事兼客省四方館事提㸃皇城司孟武節大夫惠州刺史領閤門事兼客省四方館事提㸃皇城司蘓御帯四員降授郢州防禦使帶御器械潘端卿忠州防禦使帯御器械石清武功大夫遙郡防禦使帯御器械冀彦明武功大夫兼閤門宣贊舎人帯御器械李彦實宗室三員安慶軍承宣使同知太宗正事士街建州觀察使士劇瓊州觀察使居廣外官六員建寜軍節度使提舉萬夀觀韋謙崇慶軍節度使提舉萬夀觀韋慶逺軍節度使提舉萬夀觀吴蓋崇信軍承宣使提舉佑神觀劉光烈永寜軍承宣使提舉佑神觀朱孝莊武慶軍承宣使提舉佑神觀王安道各食七味蜜煎一合時果一合酒五瓶第四等環衛官九員右監門衛大將軍貴州刺史居閑右監門衛大將軍福州防禦使士輻右監門衛大將軍榮州團練使士右監門衛大將軍貴州團練使士歆右監門衛大將軍宣州刺史士銖右監門衛大將軍宣州刺史士赫右監門衛大將軍吉州刺史士隌右監門衛大將軍吉州刺史士諳右監門衛大將軍吉州刺史士閘宣贊舍人十八人王漢臣陳清王肯郭蔓之許彦洪鄭應之裴良弼陳迪李大有王拜昌張彦圭梁份鄭立之李邦傑蔡舜臣谷璹王徳霖張安世閤門祇候二十人李丙李唐誼鄭明范涉周諲張令綽張拱楊介賈公正陳仲通劉堯咨張耘何忱李偁王謙董原劉伉劉康祖何超祖朱邦達㸔戲祇候八人梁振之王誼董珩司馬純潘思䕫張赫馮倚劉堯卿提㸃魚祇應五人李觀邊思聰逯鎬鄭孝禮常士㢘三省樞宻房副承旨六人劉興仁劉興賢韓師文武璹邊俊民嚴經安隨駕諸局幹辦監官等十八人成州團練使幹辦皇城司馮持右武郎幹辦皇城司劉允升保義郎幹辦御㕑潘邦保義郎幹辦御㕑馮藻保義郎幹