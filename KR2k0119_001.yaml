body:
  text: 武林舊事卷一宋周密撰慶夀册寶壽皇聖孝冠絶今古承顔兩宫以天下養一時盛事莫大於慶夀之典今托録大略於此淳熙三年光堯聖壽七十預于舊嵗冬至加上兩宫尊號立春日行慶夀禮至十三年太上八十正月元日再舉慶典其日文武百僚集大慶殿各服朝服用法駕五百三十四人大樂四十八架正樂工一百八十八人及列儀仗鼓吹於殿門外上服通天冠絳紗袍執大圭恭行册寶之禮鼓吹振作禮儀使已下皆導從上乘輦從至德夀宫俟太上升御座宫架樂作皇帝北向再拜奏起居致詞曰臣某稽首言伏惟太上皇帝陛下夀同天永德與日新典册揚徽華夷賴慶左相宣答曰太上皇帝聖旨皇帝迎陽展采鏤牒榮親何幸吾身屢觀盛事次皇太子已下稱賀致詞宣答訖並再拜舞蹈禮畢次詣太上皇后殿行禮如前候解嚴訖皇帝入宫進奉禮物行家人禮御宴極歡自皇帝以至羣臣禁衛吏卒往來皆簪花後三日百官拜表稱賀於文德殿四方萬姓不逺千里快覩盛事都民垂白之老喜極有至泣下者楊誠齋詩云長樂宫前望翠華玉皇來賀太皇家青天白日仍飛雪錯認東風轉栁花春色何須羯鼓催君王元日領春回牡丹芍藥薔薇朵都向千官帽上開任斯菴詩云金爵觚稜曉日開三朝喜氣一時回聖人先御紅鸞扇天子龍輿萬騎來霜曉君王出問安寶香隨輦護朝寒五雲深處三宫宴九奏聲中二聖歡四孟駕出先期禁衛所閣門牒臨安府約束居民不許登髙及衩袒觀看男子並令衫帶婦人裙背仍先一日封閉樓門取責知委不許容著來歷不明之人殿步三司各撥統制將官軍兵六千二百人擺齪諸巷大禮則倍此數至日五鼓地分頭項沿門驅逐雜人外儀衛節次如左地分約攔諸廂約攔緝捕使臣都轄官約攔軍器庫從物內藏庫從物御酒庫從物御厨從物祇候庫從物騏驥院御馬兩行御藥院藥架引從舍人兩行諸司庫務官兩行搜視行宫司行宫殿門控攏親從二百十五人前驅親從兩行各二十一人贊喝舍人兩行各八人天武兩行各八人居外都下親從兩行各八人居內駕頭閣門祇候乘騎捧駕引主駕首兩行各五人閣門提點兩行御史臺知班兩行尚書省録事密院副承旨珠子御座御馬院馬喝御座閣門簿書兩行宣贊舍人兩行茶酒班環衛官帶御器械攔前等輦官人員逍遙輦輦官十六人御輦院官閣門承受兩行御燎子頭籠翰林司官御絲鞋所御服所御座馬兩行十匹馬院總管御軍器庫睿思殿庫閣門庫閣門覺察官兩行長入祇候兩行各二十六人茶酒班殿侍各二十一人快行親從各三十二人擊鞭兩行各七人殿前指揮兩行各三十一人居外茶酒班殿侍兩行各六人執從物居內編排禁衛行子三十一人於內往來編排等子人員十將兩行各十人居外御龍直共八十二人執從物居內知閣門事乘馬行圍子內親從方圍子兩行各一百四十人步帥乘馬行圍子內圍子兩邊各四重第一重內殿直以下兩邊各一百人第二重崇政殿圍子兩邊各一百人第三重御龍直兩邊各一百人第四重崇政殿圍子兩邊各一百人水手并覻捕等子兩邊各五人攔前崇政殿親從十七人殿帥乘騎行圍子內中道主管禁衛所內官等子兩邊各十五人居外中道第二日并恭謝教坊樂人迎駕念致語口號等并教坊樂部於此排立快行親從兩邊各三十人麈斧拂子水晶骨朵香毬二打燭快行兩行駕回不用編排官二人執燈籠親從兩行各七十四人列至衆安橋去燭駕回先行行門兩行各十二人當食官聽宣官輦官人員平輦輦官一十六人黃羅御繖二黃羅御扇二挾輦御樂帶插外御帶帶插閣下官閣門覺察舍人攔後圍子挾輦指揮使各二十一人輦後樂東西兩班各三十六人第一日不作天武兩行各八人居外都下親從兩行各八人扇筤挾輦內殿直各二十二人宰臣使相執政宰執後約攔親從各二十二人閣門覺察宣贊舍人侍從後約攔親從各二十二人從駕臣僚分東西班東班係尚書侍郎兩制等官西班係正任宗室遙郡車駕所經諸百官司皆結綵門迎駕起居俟駕頭將至知班行門喝班到排立次喝躬身拜再拜駕回不拜值雨免拜班首奏聖躬萬福唱喏直身立齪巷軍兵則呼萬嵗大禮南郊明堂三嵗一郊預於元日降詔以冬至有事於南郊或用次年元日行事明堂止於半年前降詔用是嵗季秋上辛日先於五六月內擇日命帥漕及修內司修飾郊壇及絞縛青城齋殿等屋凡數百間悉覆以葦席護以青布并差官兵修築泥路自太廟至泰禋門又自嘉會門至麗正門計九里三百二十步明堂止自太廟至麗正門皆以潮沙填築其平如席以便五輅之往來每隊各有歌頭以綵旗為號唱和杵歌等曲以相兩街居民各以綵段錢酒為犒又命象院教象前𨗳朱旗以二金三鼓為節各有幞頭紫衣蠻奴乘之手執短钁旋轉跪起悉如人意市井因競市繪塑小象以餽遺四方又以車五乘壓之以鐵多至萬斤與輅輕重適等以觀疾徐傾側之勢至前一月進呈謂之閃試及駕出前一日縛大綵屋於太廟前置輅其中許都人觀曕先自前一月以來次第按試習儀殆無虛日郊前十日執事陪祀等官並受誓戒於尚書省宗室赴太廟受誓戒前三日百官奏請皇帝致齋於大慶殿是日上服通天冠絳紗袍綪結珮升髙座侍中奏請降座就齋室次日車駕詣景靈宫服衮冕行禮儀從並同四孟禮畢駕回就赴太廟齋殿宿齋是夕四鼓上服衮冕詣祖宗諸室行朝饗之禮是夜鹵簿儀仗軍兵於御路兩旁分列間以籸盆蕡燭自太廟直至郊壇泰禋門輝映如晝宰執親王貴家巨室列幕櫛比皆不逺千里不憚重費預定於數月之前而至期猶有為有力所奪者珠翠錦繡絢爛於二十里間雖寸地不容間也歌舞逰遨工藝百物輻輳爭售通宵駢闐至五更則䂍矟先驅所至皆滅燈火蓋清道祓除之義黎明上御玉輅從以四輅金象革木導以馴象千官百司法駕儀仗錦繡雜遝蓋十倍孟饗之數聲容文物不可盡述次第出嘉會門至青城齋宿明堂則徑入麗正門齋殿齋宿四壁皆三衙諸軍周廬座甲軍幕旌旗布列前後傳呼唱號列燭互巡往來如織行宫至暮則嚴更警惕太廟齋宿亦然鼓角轟振又有衛士十餘隊每隊十餘人互喝云是與不是衆應曰是又喝曰是甚人衆應曰殿前都指揮使某人謂之喝攔至三鼓執事陪祀官並入就黃壇排立萬燈輝耀燦若列星凡齪燈皆自為志號如捧俎官則畫一人為捧俎之狀等類蓋燈多不容不以此辨認亦有好竒可笑者用丑時一刻行事至期上服通天冠絳紗袍乘輦至大次禮部侍郎奏中嚴外辨禮儀使奏請皇帝行事上服衮冕步至小次升自午階天步所臨皆藉以黃羅謂之黃道中貴一人以大金合貯片腦迎前撒之禮儀使前導殿中監進大圭至版位禮直官奏有司謹具請行事宫架樂作自此上進止皆作樂時壇壝內外凡數萬衆皆肅然無譁天風時送珮環韶濩之音真如九天吹下也太社令升煙燔牲首上先詣昊天位次皇地祇次祖宗位奠玉祭酒讀册文武二舞次亞終獻行禮畢上詣飲福位受爵飲福酒登歌樂作禮直官喝賜胙次送神次望燎訖禮儀使奏禮畢上還大次更衣乘輦還齋宫百僚追班賀禮成於端誠殿黎明上乘大安輦從以五輅進發教坊排立奏念致語口號訖樂作諸軍隊伍亦次第鼓吹振作千乘萬騎如雲奔潮湧四方萬姓如鱗次蟻聚迤邐入麗正門教坊排立再奏致語口號舞畢降輦小憩以俟辦嚴登門肆赦辨陽老人有詩云黃道宫羅瑞腦香衮龍升降佩鏘鏘大安輦奏乾安曲萬點明星簇紫皇又曰萬騎雲從簇錦圍內官排立馬如飛九重閶闔開清曉太母登樓望駕歸李鶴田詩云嚴更頻報夜何其萬甲聲傳逺近隨梔子燈前紅炯炯大安輦上赴壇時郊壇天盤至地髙三丈二尺四寸通七十二級分四成上廣七丈共十二階分三十六龕午階濶一丈主上升降由此階其餘各濶五尺圓壇之上止設昊天上帝皇地祇二神位及太祖太宗配天十六龕共祀五帝太乙感生北極北斗及分配衆星三百六十位儀仗用六千八百八十九人自太廟排列至青城玉輅下祇應人共三百二十一人呵喝人員二人教馬官二人挾捧輪將軍四人推輪車子官健八人駕士班直二百三十二人千牛衛將軍二員抱太常龍旗官六員職掌五人專知官一名手分一名庫子八人裝挂匠二人諸作工匠十五人蓋覆儀鸞司十一人監官三員金象革木輅每輅下一百五十六人玉輅青飾金輅黃飾象輅紅飾革輅淺色飾朩輅黑飾輅下人冠服並依輅色玉輅前儀仗騎導騎導官左壁文臣右壁武臣六軍儀仗官兵二千二百三十二人左右諸衛將軍十三員中道五員左右八員金吾街仗司執䂍矟八十人攝將軍八員仗下監門二十六員鼓吹五百八十三人導駕樂人三百三十人登門肆赦其日駕自文德殿詣麗正門御樓教坊作樂迎導參軍色念致語雜劇色念口號至御幄降輦門下閣門進中嚴外辦牌訖御樂喝捲簾上出幄臨軒門下鳴鞭宫架奏曲簾捲扇開樂止撞右五鐘黃繖才出門下宰臣以下兩拜分班立門上中書令稱有敕立金雞門下侍郎應諾宣奉敕立金雞雞竿一起門上仙鶴童子捧赦書降下閣門接置案上太常寺擊鼓鼓止捧案至樓前中心知閣稱宣付三省參政跪受捧制書出班跪奏請付外施行門上中書令承旨宣曰制可門下參政稱宣付三省遂以制書授宰臣跪受訖閣門提點開拆授宣赦舍人捧詣宣制位起居舍人一員摘句讀舍人稱有制宰臣以下再拜俟讀至咸赦除之獄級奏脫枷訖罪囚應喏三呼萬嵗歌呼而出候宣赦訖門上舍人贊樞密及中書令曲賀兩拜門下宣制舍人捧制書授宰臣宰臣授刑部尚書尚書授刑房録事訖歸班兩拜致詞三舞蹈三叩頭知閣稱有制宰臣以下再拜知閣宣答云云若時大慶與卿等同之又拜舞如前門下中書令奏禮畢扇合宫架樂作簾降樂止撞左五鐘門下禮部郎中奏解嚴上還幄次門下鳴鞭舍人喝奉敕放仗宰臣以下再拜退次宣勞將士訖乘輦歸內至南宫門教坊司迎駕念致語口號如前至文德殿降輦舞畢退辨陽老人詩云換輦登門捲御簾侍中承制舍人宣鳳書乍脫金雞口一派歡聲下九天金雞竿長五丈五尺四靣各百戲一人緣索而上謂之搶金雞先到者得利物呼萬嵗纈羅襖子一領絹十匹銀碗一隻重三兩諸州進奏院各有遞鋪腰鈴黃旗者數人俟宣赦訖即先發太平州萬州夀春府取太平萬夀之語以次俱發鈴聲滿道都人競觀樓下排立次第青龍白虎旗各一信旗二方扇二方圓罕畢二􅓚四劍二將軍二僧衆居左道衆居右玉輅居中太常宫架樂宣赦臺招拜紅旗擊鼓三院罪囚獄級居左御馬六匹居右宣制位居中橫門快行承旨三省官以下恭謝大禮後擇日行恭謝禮第一日駕出如四孟儀詣景靈宫天興殿聖祖前行恭謝禮次詣中殿祖宗神御前行禮還齋殿進膳訖引宰臣以下賜茶茶畢奏事訖還內第二日上乘輦自後殿門出教坊都管以下於祥曦殿南迎駕起居參軍色念致語雜劇色念口號樂作駕後樂東西班則於和寧門外排立後從作樂將至太乙宫道士率衆執威儀於萬夀觀前入圍子內迎駕起居作法事前導入太乙宫門降輦候班齊詣靈休殿參神次詣五福十神太乙次詣申佑殿本命北辰殿通真殿佑聖順福殿太后本命延夀殿南極火德殿禮畢宣宰臣以下合赴坐官並簪花對御賜宴上服幞頭紅上蓋玉束帶不簪花教坊樂作前三盞用盤盞後二盞屈卮御筵畢百官侍衛吏卒等並賜簪花從駕縷翠滴金各競華麗望之如錦繡衙前樂都管以下三百人自新樁橋西中道排立迎駕念致語口號如前樂動滿路花至殿門起夀同天曲破舞畢退薑白石有詩云六軍文武浩如雲花簇頭冠樣樣新惟有至尊渾不戴盡將春色賜羣臣萬數簪花滿御街聖人先自景靈回不知後靣花多少但見紅雲冉冉來是日皇后及內中車馬先還宮中呼后為聖人聖節其日俟宰執奏事訖退班上坐垂拱殿先引樞密院并管軍官上夀東京分為二日今只并為一日禮畢再坐紫宸殿上公以下分立候奏班齊上公詣御茶牀前躬進御酒跪致詞云文武百僚臣某等稽首言天基令節聖節名逐朝換臣等不勝大慶謹上千萬嵗夀下殿再拜樞密宣答云得公等夀酒與公等內外同慶又再拜教坊樂作接盞訖跪起舞蹈如儀閣門官喝不該赴坐官先退樞密喝羣臣升殿閣門分引上公以下合赴坐官升殿第一盞宣視盞送御酒歌板色唱祝堯齡賜百官酒觱篥起舞三臺後並準此供進肉鹹豉第二盞送御酒歌板起中腔供進雜爆第三盞歌板唱踏歌供進肉鮓候內官起茶牀樞密跪奏禮畢羣臣降階舞蹈拜退此上夀儀大略也若錫宴節次大率如夢華所載兹不贅書今偶得理宗禁中夀筵樂次因列於此庶可想承平之盛觀也天基聖節排當樂次正月五日樂奏夾鐘宮觱篥起萬夀永無疆引子王恩上夀第一盞觱篥起舞聖夀齊天樂慢周潤第二盞笛起帝夀昌慢潘俊第三盞笙起升平樂慢侯璋第四盞方響起萬方寧慢余勝第五盞觱篥起永遇樂慢楊茂第六盞笛起夀南山慢盧寧第七盞笙起戀春光慢任榮祖第八盞觱篥起賞仙花慢王榮顯第九盞方響起碧牡丹慢彭先第十盞笛起上苑春慢胡寧第十一盞笙起慶夀樂慢侯璋第十二盞觱篥起栁初新慢劉昌第十三盞諸部合萬夀無疆薄媚曲破初坐樂奏夷則宮觱篥起上林春引子王榮顯第一盞觱篥起萬嵗梁州曲破齊汝賢舞頭豪俊邁舞尾范宗茂第二盞觱篥起聖夀永歌曲子陸恩顯琵琶起捧瑶卮慢王榮祖第三盞唱延夀長歌曲子李文慶嵇琴起花梢月慢李松第四盞玉軸琵琶獨彈正黃宫萬夀永康寧俞達拍王良卿觱篥起慶夀新周潤進彈子笛哨潘俊杖鼓朱堯卿拍王良卿進念致語等時和伏以華樞紀節瑶池先五日之春玉厯發祥聖世啓千齡之運歡騰薄海慶溢大廷恭惟皇帝陛下濬哲如堯儉勤邁禹躬行德化躋民夀域之中治洽泰和措世春臺之上皇后殿下道符坤順位儷乾剛宫闈資隂教之修海宇仰母儀之正有德者必夀六十箇甲子環周申命其用休億萬載皇圖鞏固臣等生逢華旦叨預伶官輒采聲詩恭陳口號上聖天生自有真千齡寶運紀休辰貫樞瑞彩昭璇象滿室紅光裊翠麟黃閣清夷瑤莢曉未央間暇玉巵春箕疇五福咸敷斂皇極躬持錫庶民日遲鸞斾喜聆舜樂之和天近鵷墀宜進齊諧之伎闕上奉天顔吳師賢以下上進小雜劇雜劇吳師賢以下做君聖臣賢爨斷送萬嵗聲第五盞笙獨吹小石角長生寶宴樂侯璋拍張亨笛起降聖樂慢盧寧雜劇周朝清以下做三京下書斷送瑶池逰第六盞筝獨彈高雙調聚仙歡陳儀拍謝用方響起堯階樂慢劉民和聖花金寶第七盞玉方響起獨打道調宫聖壽永余勝拍王良卿筝起出墻花慢吳宣雜手藝祝壽進香仙人趙喜第八盞萬夀祝天基斷隊第九盞簫起縷金蟬慢傅昌寧笙起託嬌鶯慢任榮祖第十盞諸部合齊天樂曲破再坐第一盞觱篥起慶方春慢楊茂笛起延夀曲慢潘俊第二盞筝起月中仙慢俟端嵇琴起夀爐香慢李松第三盞觱篥起慶簫韶慢王榮祖笙起月明對花燈慢任榮祖第四盞琵琶獨彈髙雙調會羣仙方響起玉京春慢余勝雜劇何晏喜以下做楊飯斷送四時歡第五盞諸部合老人星降黃龍曲破第六盞觱篥獨吹商角調筵前保夀樂雜劇時和以下做四喏少年逰斷送賀時豐第七盞鼓笛曲拜舞六么弄傀儡踢架兒盧逢春第八盞簫獨吹雙聲調玉簫聲第九盞諸部合無射宫碎錦梁州歌頭大曲雜手藝永團圓趙喜第十盞笛獨吹髙平調慶千秋第十一盞琵琶獨彈大吕調夀齊天撮弄夀果放生姚潤第十二盞諸部合萬夀興隆樂法曲第十三盞方響獨打髙宫惜春傀儡舞鮑老第十四盞筝琶方響合纒令神曲第十五盞諸部合夷則羽六么巧百戲趙喜第十六盞管下獨吹無射商栁初春第十七盞鼓板舞綰夀星姚潤第十八盞諸部合梅花伊州第十九盞笙獨吹正平調夀長春傀儡羣仙會盧逢春第二十盞觱篥起萬花新曲破祇應人都管周朝清陸恩顯雜劇色吳師賢趙恩王太一朱旺豬兒頭時和金寶俞慶何晏喜沈定吳國寶王夀趙寧胡寧鄭喜陸夀歌板色李文慶拍板色王良卿張亨謝用簫色傅昌寧朱明復李允信筝色陳儀豪輔文吳宣豪俊賢徐顯祖張廣琵琶色王榮祖俞達豪俊民豪俊邁段繼祖嵇琴色李松侯端孫民顯笙色侯璋葉茂青任榮祖董茂張瑾潘寶姚拱范椿孫昌莫正周珍馬椿姚舜臣陳保觱篥色齊汝賢周潤楊茂王恩王榮顯薑師賢劉昌楊彬王福杜明喻祥周忠恕夏福徐珏周喜聞澄沈夀丁預鄭亨周佐楊瑾沈康鄭聰莫夀潘顯祖時潤胡佾周信李圭李潤史顯金夀笛色楊德茂潘俊盧寧彭俊賀昌賀夀胡師文夀椿姚寶張茂祖崔興朱珍張茂才金貴潘顯祖沈夀周興李大用董大有金明趙喜莫及張春葉茂胡寧任顯張椿孫寧彭俊李榮全寧金彥恭董喜王佑來亨王喜顧和顧松金顯董寧杜松李椿張椿何福管思齊朱喜花椿李拱辰方響色余勝彭先劉民和黃桂薑大亨張榮杖鼓色朱堯卿馮喜時忠施榮朱拱辰周忠李顯姚寶葉茂李榮祖大鼓色王喜鄧珍王宣顧榮舞旋色范宗茂內中上教張明倪椿潘恩石琇張琳弄傀儡盧逢春等六人雜手藝姚潤等九人女厮撲張椿等十人築毬軍陸寶等二十四人百戲沈慶等六十四人百禽鳴胡福等二人武林舊事卷一
