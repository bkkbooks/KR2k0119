body:
  text: 武林舊事卷二宋周密撰御教夀皇留意武事在位凡五大閲乾道二年四年六年淳熙四年十年或幸白石或幸茅灘或幸龍山一時儀文士馬戈甲旌旗之盛雖各不同今撮其要以著於此先一日諸軍人馬全裝執色於教場東布列軍幕宿營至日殿前馬步諸軍先赴教場下方營并親隨軍排列將壇之後質明三衙管軍官並全裝從駕上自祥曦殿戎服乘馬太子親王宰執近臣並戎服乘馬以從護聖馬軍八百騎分執槍旗弓矢軍器前後奏隨軍番部大樂寺詳見後御教儀衛次第駕入教場升幄殿帥執檛躬奏諸司人馬排立齊舉黃旗招諸軍向御殿敲梆子一鼓唱喏一鼓呼萬嵗再一鼓又呼萬嵗疊鼓呼萬萬嵗又一鼓唱喏殿帥奏取聖旨鳴角發嚴上御金裝甲胄登將壇幄殿鳴角戒嚴殿帥奏取聖旨馬步軍整隊成屯以備教戰連三鼓馬軍上馬步軍起旗槍分東西為應敵之勢舉白旗教方陳黃旗變圓陳皂旗變曲陳青旗變直陳緋旗變鋭陳緋心皂旗作長蛇陳緋心白旗作伏虎陳殿帥奏取聖旨兩陳各遣勇將挑戰變八圓陳疊鼓舉旗左馬軍戰右步軍右馬軍戰左步軍再疊鼓交旗擊刺混戰三疊金分陳大勢馬軍四靣大戰三疊金分陳殿帥奏教陳訖取旨人馬排列當頭鳴角簇隊以俟放教諸軍呈大刀車炮煙槍諸色武藝御前傳宣撫諭將士射生官進獻獐鹿上更戎服賜宰臣以下對御酒五行殿帥奏取聖旨謝恩如前唱喏訖駕出教場是日太上皇於都亭驛設簾幄以觀駕至邀上入幄宣喚管軍官賜大金碗酒於簾外都人贊嘆以為盛觀時殿司旗幟以黃馬司以緋步司以白以道路狹促止用從駕軍一萬二千四百人分為二百四十八小隊戈甲耀日旌旗蔽天連亘二十餘里粲如錦繡都人縱觀以為前所未有凡支犒金銀錢帛以巨萬計悉出內庫户部不與焉御教儀衛次第文物儀衛並同四孟駕出今止添入後項彈壓前隊侍立使臣都轄執黃龍旗使臣執繡龍旗使臣帶弓箭汗胯豹尾使臣四員帶汗胯員騎劍使臣十員彈壓後隊侍立使臣都轄黃羅戲珠龍旗黃繡龍旗二豹尾使臣四員騎劍使臣十人供進馬四匹帶甲御馬御前全裝甲馬管押使臣幕士內中正供馬獸醫押槽黃繡龍傳宣旗二小黃傳宣旗十隨逐巡視官馬院禁衛官引馬監官二員供馬監官二員聖駕供鞭通管二員掇梢提轄二員日烏獨腳旗挾駕指揮使四十二人銷金龍旗二犀皮御座椅鈐鎚刀子左匙筯刀子右青氊御笠褐氈御笠金鳳瓶絲鞋篋子御膳篋子玉靶于闐刀馬腦于闐刀水晶于闐刀金洗嗽皂白御靴通犀于闐刀角靶于闐刀酒鱉子大小白虎皮杖榼白豹皮杖榼梳刷馬盂袋黑漆套盤圭朩套盤銷金弓箭葫蘆虎豹皮弓箭袋葫蘆飲水角拍板二哨笛四番鼓二十四人彈壓樂器使臣管押訓練官杏黃龍旗二觱篥二札子九大鼓十龍笛四從駕官宰臣以下並如常日臨安府彈壓官屬燕射淳熙元年九月孝宗幸玉津園講燕射禮皇太子宰執使相侍從正任皆從輦至殿門外少駐教坊進念致語口號作樂出麗正門由嘉會門至玉津園賜宴酒三行上服頭巾窄衣束帶絲鞋臨軒內侍御帶進弓箭看箭人喝看御箭教坊樂作射垜前排立招箭班應喏皇帝第二箭射中皇太子以下各再拜稱賀進御酒并宣勸訖皇太子以下及臣僚射弓第四箭射中上再射第五箭又中的傳旨不賀舍人先引皇太子當殿賜窄衣金束帶次引射中臣僚受賜如前再進御酒奏樂用雜劇次賜宰臣以下十兩銀碗各一隻上賦七言詩丞相曽懷以下屬和以進上乘逍遙輦出玉津園門教坊進念口號至祥曦殿降輦招箭班者服紫衣幞頭義手立於垜前御箭之來能以幞頭取勢轉導入的亦絶技也公主下降南渡以來公主無及嫁者獨理宗朝周漢國公主出降慈明太后姪孫楊鎮禮文頗盛今托梗槩於此先是擇日遣天使宣召駙馬至東華門引見便殿賜玉帶靴笏鞍馬及紅羅百匹銀器百兩衣著百匹聘財銀一萬兩對御賜筵五盞用教坊樂俟畢謝恩訖乘塗金御仙花鞍轡狨座馬執絲鞭張三簷繖教坊樂部五十人前引還第謂之宣繫進財物件並照國朝會要太常寺關報有司辦造先一月宣宰執常服繫鞋詣後殿西廊觀看公主房奩真珠九翬四鳳冠褕翟衣一副真珠玉珮一副金革帶一條玉龍冠綬玉環北珠冠花篦環七寶冠花篦環真珠大衣背子真珠翠領四時衣服纍珠嵌寶金器塗金器貼金器出從貼金銀裝擔等錦繡銷金帳幔陳設茵褥地衣步障等物其日駙馬常服玉帶乘馬至和寧門易冕服至東華門用雁幣玉馬等行親迎禮用熙寧故事公主戴九翬四鳳冠服褕翟纁袖升其前天文官本位從物從人燭籠二十本位使臣插叉童子八人方扇四圓扇四引障花十提燈二十行障坐障皇后親送乘九龍子皇太子乘馬圍子左右兩重其後太師判宗正寺榮王榮王夫人及諸命婦至第賜御筵九盞筵畢皇后太子先還公主歸位行同牢禮用開寶禮然後親行盥饋舅姑之禮開寶通禮謁見舅姑用名紙一副衣一襲手帕一合糚盝藻豆袋銀器三百兩衣著五百匹餘親各有差三朝公主駙馬並入內謝恩宣賜禮物賜宴禁中外廷奉表稱賀賜宰執親王侍從內職管軍副都指使以上金銀錢幣會子有差依熙寧式駙馬家親屬各等第推恩唱名第一名承事郎第二名第三名並文林郎第一甲賜進士及第第二甲同進士及第第三甲四甲賜進士出身第五甲同進士出身武舉第一名秉義郎特奏第一名同進士出身上御集英殿拆號唱進士名各賜緑襴袍白簡黃襯衫武舉人賜紫羅袍鍍金帶牙笏賜狀元等三人酒食五盞餘人各賜泡飯前三名各進謝恩詩一首皆重戴緑袍絲鞭駿馬快行各持黃敕於前黃旗雜遝多至數十百靣各書詩句於上呵殿如雲皆平日交逰親舊相迓之人或三學使令齋臧輩若執事之人則係帥漕司差到狀元局祇應亦有術人相士輩自衒預定魁選鼓舞於中自東華門至期集所豪家貴邸競列綵幕縱觀其有少年未有室家者亦往往於此擇壻焉期集所例置局於禮部貢院前三人主之於內遴選所長以充職事有糾彈箋表主管題名小録掌儀典客掌計掌器掌膳掌酒果監門等後旬日朝謝又數日拜黃甲敘同年其儀三名設褥於堂上東西相向四十以上立於東廊四十以下立於西廊皆再拜拜已擇榜中年長者一人狀元拜之復擇少者一人拜狀元又數日赴國子監謁謝先聖先師訖賜聞喜宴於局中侍從以上及館職皆與知舉官押宴遂立題名石刻凡費悉出於官及諸閫饋遺云元正朝廷元日冬至行大朝會儀則百官冠冕朝服備法駕設黃麾仗三千三百五十人視東京巳減三之一用太常雅樂宫架登歌太子上公親王宰執並赴紫宸殿立班進酒上千萬嵗夀上公致詞樞密宣答次諸國使人及諸州入獻朝賀然後奏樂進酒賜宴此禮不能常行每嵗禁中止是以三茅鐘鳴駕興上服幞頭玉帶靴袍先詣福寧殿龍墀及聖堂炷香用蠟沈腦子次至天章閣祖宗神御殿行酌獻禮次詣東朝奉賀復回福寧殿受皇后太子皇子公主貴妃至郡夫人內官大內以下賀賀畢駕始過大慶殿御史臺閣門分引文武百僚追班稱賀大起居十六拜致詞上夀樞密宣答禮畢放仗是日後苑排辦御筵於清熙殿用插食盤架午後修內司排辦晚筵於慶瑞殿用煙火進市食賞燈並如元夕立春前一日臨安府進大春牛設之福寧殿庭及駕臨幸內官皆用五色絲綵杖鞭牛御藥院例取牛睛以充眼藥餘屬直閣婆號管人都行首掌管預造小春牛數十飾綵幡雪栁分送殿閣巨璫各隨以金銀錢彩段為酬是日賜百官春幡勝宰執親王以金餘以金裹銀及羅帛為之係文思院造進各垂於幞頭之左入謝後苑辦造春盤供進及分賜貴邸宰臣巨璫翠縷紅絲金雞玉燕備極精巧每盤直萬錢學士院撰進春帖子帝后貴妃夫人諸閣各有定式絳羅金縷華粲可觀臨安府亦鞭春開宴而邸第饋遺則多效內廷焉元夕禁中自去嵗九月賞菊燈之後迤邐試燈謂之預賞一入新正燈火日盛皆修內司諸璫分主之競出新意年異而嵗不同往往於復古膺福清熙明華等殿張挂及宣德門梅堂三間臺等處臨時取旨起立鰲山燈之品極多見後燈品每以蘇燈為最圈片大者徑三四尺皆五色琉璃所成山水人物花竹翎毛種種竒妙儼然著色便面也其後福州所進則純用白玉晃耀奪目如清氷玉壺爽徹心目近嵗新安所進益竒雖圈骨悉皆琉璃所為號無骨燈禁中嘗令作琉璃燈山其髙五丈人物皆用機關活動結大綵樓貯之又於殿堂梁棟窗户間為涌壁作諸色故事龍鳳噀水蜿蜒如生遂為諸燈之冠前後設玉柵簾寶光花影不可正視仙韶內人迭奏新曲聲聞人間殿上鋪連五色琉璃閣皆毬文戲龍百花小窗間垂小水晶簾流蘇寶帶交映璀璨中設御座恍然如在廣寒清虛府中也至二鼓上乘小輦幸宣德門觀鰲山擎輦者皆倒行以便觀燈金爐腦麝如祥雲五色熒煌炫轉照耀天地山燈凡數千百種極其新巧怪怪竒竒無所不有中以五色玉柵簇成皇帝萬嵗四大字其上伶官奏樂稱念口號致語其下為大露臺百藝羣工競呈竒技內人及小黃門百餘皆巾裹翠蛾效街坊清樂傀儡繚繞於燈月之下既而取旨宣喚市井舞隊及市食盤架先是京尹預擇華潔及善歌呌者謹伺於外至是歌呼競入既經進御妃嬪內人而下亦爭買之皆數倍得直金珠磊落有一夕而至富者宫漏既深始宣放煙火百餘架於是樂聲四起燭影縱橫而駕始還矣大率倣宣和盛際愈加精妙時無登樓賜宴之事人間不能詳知耳都城自舊嵗冬孟駕回則已有乘肩小女鼓吹舞綰者數十隊以供貴邸豪家幕次之玩而天街茶肆漸已羅列燈毬等求售謂之燈市自此以後每夕皆然三橋等處客邸最盛舞者往來最多每夕樓燈初上則簫鼓巳紛然自獻於下酒邊一笑所費殊不多往往至四鼓乃還自此日盛一日薑白石有詩云燈巳闌珊月色寒舞兒往往夜深還只應不盡婆娑意更向街心弄影看又云南陌東城盡舞兒畫金刺繡滿羅衣也知愛惜春逰夜舞落銀蟾不肯歸吳夢窗玉樓春云茸茸貍帽遮梅額金蟬羅剪胡衫窄乘肩爭看小腰身倦態強隨間鼓笛問稱家在城東陌欲買千金應不惜歸來困頓殢春眠猶夢婆娑斜趂拍深得其意態也至節後漸有大隊如四國朝傀儡杵歌之類日趨於盛其多至數十百隊天府每日差官點視各給錢酒油燭多寡有差且使之南至升陽宫支酒燭北至春風樓支錢終日天街鼓吹不絶都城士女羅綺如雲蓋無夕不然也至五夜則京尹乘小提轎諸舞隊次第簇擁前後連亘十餘里錦繡填委簫鼓振作耳目不暇給吏魁以大囊貯楮劵凡遇小經紀人必犒數十謂之買市至有黠者以小盤貯梨藕數片騰身迭出於稠人之中支請官錢數次者亦不禁也李篔房詩云斜陽盡處蕩輕煙輦路東風入管絃五夜好香隨步暖一年明月打頭圓香塵掠粉翻羅帶密炬籠綃鬭玉鈿人影漸稀花露冷踏歌聲度曉雲邊京尹幕次例占市西坊繁閙之地蕡燭籸盆照耀如晝其前列荷校囚數人大書犯由云某人為不合搶撲叉環挨搪婦女繼而行遣謂之裝燈其實皆三獄罪囚姑借此以警姦民又分委府僚巡警風燭及命都轄房使臣等分任地方以緝姦盜三獄亦張燈建淨獄道場多裝獄户故事及陳列獄具邸第好事者如清河張府蔣御藥家間設雅戲煙火花邊水際燈燭粲然逰人士女縱觀則迎門酌酒而去又有幽坊靜巷好事之家多設五色琉璃泡燈更自雅潔靚粧笑語望之如神仙白石詩云沙河雲合無行處惆悵來逰路已迷却入靜坊燈火空門門相似列蛾眉又云遊人歸後天街靜坊陌人家未閉門簾裏垂燈照樽爼坐中嬉笑覺春溫或戲於小樓以人為大影戲兒童歡呼終夕不絶此類不可遽數也西湖諸寺惟三竺張燈最盛往往有宮禁所賜貴璫所遺者都人好竒亦往觀焉白石詩云珠絡琉璃到地垂鳳頭銜帶玉交枝君王不賞無人進天竺堂深夜雨時元夕節物婦人皆帶珠翠閙蛾玉梅雪栁菩提葉燈毬銷金合蟬貂袖項帕而衣多尚白蓋月下所宜也遊手浮浪輩則以白紙為大蟬謂之夜蛾又以棗肉炭屑為丸繫以鐵絲然之名火楊梅節食所尚則乳糖團子鎚科斗粉豉湯水晶膾韭餅及南北珍果并皂兒糕宜利少澄沙糰子滴酥鮑螺酪麵玉消膏琥珀餳輕錫生熟灌藕諸色龍纒蜜煎蜜裹糖瓜蔞煎七寶薑豉十般糖之類皆用鏤鍮裝花盤架車兒簇插飛蛾紅燈綵盝歌呌喧闐幕次往往使之吟呌倍酬其直白石亦有詩云貴客鈎簾看御街市中珍品一時來簾前花架無行路不得金錢不肯回競以金盤鈿合簇飣餽遺謂之市食合兒翠簾綃幕絳燭紗籠遍呈舞隊密擁歌姬脆管清吭新聲交奏戲具紛嬰鬻歌售藝者紛然而集至夜闌則有持小燈照路拾遺者謂之掃街遺鈿墮珥往往得之亦東都遺風也舞隊大小全棚傀儡查查鬼查大李大口一字口賀豐年長瓠斂長頭兔吉兔毛大伯吃遂大憨兒粗姐麻婆子快活三郎黃金杏瞎判官快活三娘沈承務一臉膜貓兒相公洞公觜細姐河東子黑遂王缺兒交椅夾捧村田樂男女竹馬男女杵歌大小斫刀鮑老交衮鮑老子弟清音女童清音諸國獻寶六國朝四國朝穿心國入貢孫武子教女兵遏雲社緋緑社胡女鳳阮嵇琴撲蝴蝶回陽丹火藥瓦盆歌焦鎚架兒喬三教喬迎酒喬親事喬樂神馬明王喬捉蛇喬學堂喬宅眷喬像生喬師娘獨自喬地仙旱划船教象裝態屛風鼓板踏蹺撲旗抱鑼裝鬼獅豹蠻牌十齋郎耍和尚劉衮散錢行貨郎打嬌惜其品甚夥不可悉數首飾衣裝相矜侈靡珠翠錦綺眩耀華麗如傀儡杵歌竹馬之類多至十餘隊十二十三兩日國忌禁樂則有裝宅眷籠燈前引珠翠盛飾少年尾其後訶殿而來卒然遇之不辨真偽及為喬經紀人如賣蜂糖餅小八塊風子賣字本虔婆賣旗兒之類以資一笑者尤多也燈品燈品至多蘇福為冠新安晚出精妙絶倫所謂無骨燈者其法用絹囊貯粟為胎因之燒綴及成去粟則混然玻璃毬也景物竒巧前無其比又為大屏灌水轉機百物活動趙忠惠守吳日嘗命製春雨堂五大間左為汴京御樓右為武林燈市歌舞雜藝纎悉曲盡凡用千工外此有魫燈則移鏤犀珀玳瑁以飾之珠子燈則以五色珠為網下垂流蘇或為龍船鳳輦樓臺故事羊皮燈則簇縷精巧五色粧染如影戲之法羅帛燈之類尤多或為百花或細眼間以紅白號萬眼羅者此種最竒外此有五色蠟紙菩提葉若沙戲影燈馬騎人物旋轉如飛又有深閨巧娃剪紙而成尤為精妙又有絹燈剪寫詩詞時寓譏誚及畫人物藏頭隱語及舊京諢語戲弄行人有貴邸嘗出新意以細竹絲為之加以彩飾疏明可愛穆陵喜之令製百盞期限既迫勢難卒成而內苑諸璫恥於不自巳出思所以勝之遂以黃草布剪縷加之點染與竹無異凡兩日百盞已進御矣挑菜二月一日謂之中和節唐人最重今惟作假及進單羅御服百官服單羅公裳而巳二日宮中排辦挑菜御宴先是內苑預備朱緑花斛下以羅帛作小卷書品目於上繫以紅絲上植生菜薺花諸品俟宴酬樂作自中殿以次各以金篦挑之后妃皇子貴主媫妤及都知等皆有賞無罰以次每斛十號五紅字為賞五黑字為罰上賞則成號真珠玉杯金器北珠篦環珠翠領抹次亦鋌銀酒器冠錠翠色段帛龍涎御扇筆墨官窰定器之類罰則舞唱吟詩念佛飲冷水吃生薑之類用此以資戲笑王宫貴邸亦多效之進茶仲春上旬福建漕司進第一綱茶名北苑試新皆方寸小弮進御止百弮護以黃羅軟盝藉以青篛裹以黃羅夾復臣封朱印外用朱漆小匣鍍金鎖又以細竹絲織笈貯之凡數重此乃雀舌水芽所造一弮之直四十萬僅可供數甌之啜耳或以一二賜外邸則以生線分解轉遺好事以為竒玩茶之初進御也翰林司例有品嘗之費皆漕司邸吏賂之間不滿欲則入鹽少許茗花為之散漫而味亦漓矣禁中大慶會則用大鍍金􅜔以五色韻果簇飣龍鳳謂之繡茶不過悅目亦有專工者外人罕知因附見於此賞花禁中賞花非一先期後苑及修內司分任排辦凡諸苑亭榭花木粧點一新錦簾綃幕飛梭繡毬以至裀褥設放器玩盆窠珍禽異物各務竒麗又命小璫內司列肆關撲珠翠冠朵篦環繡段畫領花扇官窰定器孩兒戲具閙竿龍船等物及有賣買果木酒食餅餌蔬茹之類莫不備具悉效西湖景物起自梅堂賞梅芳春堂賞杏花桃源觀桃粲錦堂金林檎照粧亭海棠蘭亭修禊至於鍾美堂賞大花為極盛堂三面皆花石為臺三層各植名品標以象牌覆以碧幕臺後分植玉繡毬數百株儼如鏤玉屏堂內左右各列三層雕花彩檻護以彩色牡丹畫衣間列碾玉水晶金壺及大食玻璃官窰等瓶各簪竒品如姚魏御衣黃照殿紅之類幾千朵别以銀箔間貼大斛分種數千百窠分列四面至於梁棟窗户間亦以湘筒貯花鱗次簇插何啻萬朵堂中設牡丹紅錦地茵自中殿妃嬪以至內官各賜翠葉牡丹分枝鋪翠牡丹御書畫扇龍涎金合之類有差下至伶官樂部應奉等人亦霑恩賜謂之隨花賞或天顔悅懌謝恩賜豫多至數次至春暮則稽古堂會瀛堂賞瓊花靜侶亭紫笑淨香亭采蘭挑笱則春事已在緑陰芳草間矣大內宴賞初坐再坐插食盤架者謂之排當否則但謂之進酒武林舊事卷二
