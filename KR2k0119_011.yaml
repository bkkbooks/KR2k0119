front:
  text: 跋武林舊事乃弁陽老人草窓周密公謹所集也刋本止第六巻山中仇先生所藏本終十巻後歸西河莫氏家余就假於莫氏因手抄成全書以識嵗月藏於家塾至元後戊寅正月忻徳用和父此二册余假於太子太保遂安伯陳公家同年友文部副郎黄君廷用録之以歸余云𢎞治乙卯夏四月望祝武林舊事十巻元周宻公謹撰此虞山毛氏舊本余得而插諸架郎瑛七修類稿云公謹居齊之東作齊東野語居杭癸辛街作癸辛雜識泗水出山東號泗水潛夫居華不注號弁陽老人苐此編皆叙行都事似不應題泗水今此本作泗水當别有義意郎瑛又云舊事十二巻杭刻其六全者在吴人袁飛卿家海鹽姚士粦續刻五巻其第一棊待詔諸篇此本無之當為録補尚缺一巻爾康熙戊戌春王十有九日繡谷亭主
  hash: sha256:b2c3d61e8ef3ac1ec93a5085a5e653eb6d25a4c41d56144d1dc8b78dba781d2c
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2k0119_WYG_011-1a, image: WYG0590/WYG0590-0298c.png}
body:
  text: 修門地名也文山指南録序亦有皋亭山距修門三十里今杭郡志不聞有是名即巻中白石茅灘諸名亦湮沒難考矣吾友鄭芷畦湖録云四水者湖城以苕水餘不水前溪水北流水合而入於郡城之霅溪故有四水之名舊人詩四水交流霅霅聲是也據此則四水乃湖之地名公謹生於湖中年雖遷杭晚仍歸老弁山又號弁陽老人則四水潛夫之號亦猶是耳古本作四水洵乎不繆然余疑此義十年方得其説實為快心已亥中秋日焯書
  hash: sha256:4d98665765c515c56c0547db2ae369177685e3bfa23b7ebcc4281d51b640bf3d
