front:
  text: 跋武林舊事乃辨陽老人草窗周密公謹所集也刋本止第六卷山中仇先生所藏本終十卷後歸西河莫氏家余就假於莫氏因手抄成全書以識嵗月藏於家孰至元後戊寅正月欣德用和父此二册余假於太子太保遂安伯陳公家同年友文部副郎黃君廷用録之以歸余云𢎞治乙卯夏四月望祝武林舊事十卷元周密公謹撰此虞山毛氏舊本余得而插諸架郎瑛七修類稿云公謹居齊之東作齊東野語居杭癸辛街作癸辛雜識泗水出山東號泗水潛夫居華不注號辨陽老人苐此編皆叙行都事似不應題泗水今此本作泗水當别有義意郎瑛又云舊事十二卷杭刻其六全者在吳人袁飛卿家海鹽姚士粦續刻五卷其第一棊待詔諸篇此本無之當為録補尚缺一卷爾康熙戊戌春王十有九日繡谷亭主
  hash: sha256:5d23553134266516af10f9ba84eb0ecc2a1b0205c653f8ac63ae1c209f64e9bf
  markers:
  - {type: page-break, offset: 0, content: '', id: KR2k0119_WYG_011-1a, image: WYG0590/WYG0590-0298c.png}
body:
  text: 修門地名也文山指南録序亦有皋亭山距修門三十里今杭郡志不聞有是名即卷中白石茅灘諸名亦湮沒難考矣吾友鄭芷畦湖録云四水者湖城以苕水餘不水前溪水北流水合而入於郡城之霅溪故有四水之名舊人詩四水交流霅霅聲是也據此則四水乃湖之地名公謹生於湖中年雖遷杭晚仍歸老辨山又號辨陽老人則四水潛夫之號亦猶是耳古本作四水洵乎不繆然余疑此義十年方得其說實為快心已亥中秋日焯書
  hash: sha256:b1d79717e9c2dea74d5a42c707cea694b6101ba709dc77929165d03949949281
