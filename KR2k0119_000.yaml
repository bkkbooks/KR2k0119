body:
  text: 武林舊事地理類八雜記之屬提要臣等謹案武林舊事十卷宋周密撰密字公謹號草忩先世濟南人其曽祖隨髙宗南渡因家湖州淳祐中嘗官義烏令宋亡不仕終於家是書記宋南渡後都城雜事蓋密雖居於辨山實流寓杭州之癸辛街故目睹耳聞最為真確於乾道淳熙間三朝授受兩宫奉養之故迹敘述尤詳自序稱欲如吕滎陽雜記而加詳如孟元老夢華而近雅今考所載體例雖仿孟書而詞華典贍南宋人遺篇剩句頗賴以存近雅之言不謬吕希哲嵗時雜記今雖不傳然周必大平園集尚載其序稱其上元一門多至五十餘條不為不富而密猶以為未詳則是書之賅備可知矣明人所刻往往隨意刋除或僅六卷或不足六卷惟存故都宫殿教坊樂部諸門殊失著書之本旨此十卷之本乃從毛氏汲古閣元板傳鈔首尾完具其間逸文軼事皆可以備參稽而湖山歌舞靡麗紛華著其盛正著其所以衰遺老故臣惻惻興亡之隱實曲寄於言外不僅作風俗記都邑簿也第十卷下棊待詔以下以是書體例推之當在六卷之末疑傳寫或亂其舊第然無可考證今亦姑仍之焉乾隆四十六年十二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀武林舊事原序乾道淳熙間三朝授受兩家奉親古昔所無一時聲名文物之盛號小元祐豐亨豫泰至寶祐景定則幾於政宣矣豫曩於故家遺老得其梗槩及客修門間聞退璫老監談先朝舊事輒傾耳諦聽如小兒觀優終日夕不少倦既而曳裾貴邸耳目益廣朝歌暮嬉酣玩嵗月意謂人生正復若此初不省承平樂事為難遇也及時移物換憂患飄零追想昔逰殆如夢寐而感慨係之矣嵗時檀欒酒酣耳熱時為小兒女戲道一二未必不反以為夸言欺我也每欲萃成篇帙如吕滎陽雜記而加詳孟元老夢華而近雅病忘慵惰未能成書世故紛來懼終於不暇紀載因托大槩雜然書之青燈永夜時一展卷恍然類昨日事朋遊淪落如晨星霜葉而余亦老矣噫盛衰無常年運既往後之覽者能不興愾我寤歎之悲乎四水潛夫書
