body:
  text: 武林舊事卷三宋周密撰西湖遊幸都人逰賞淳熙間夀皇以天下養每奉德夀三殿逰幸湖山御大龍舟宰執從官以至大璫應奉諸司及京府彈壓等各乘大舫無慮數百時承平日久樂與民同凡逰觀買賣皆無所禁畫楫輕舫旁午如織至於果蔬羮酒關撲宜男戲具閙竿花籃畫扇彩旗糖魚粉餌時花泥嬰等謂之塗中土宜又有珠翠冠梳銷金彩段犀鈿髹漆織藤窰器玩具等物無不羅列如先賢堂三賢堂四聖觀等處最盛或有以輕橈趂逐求售者歌妓舞鬟嚴糚自衒以待招呼者謂之水仙子至於吹彈舞拍雜劇雜扮撮弄勝花泥丸鼓板投壺花彈蹴踘分茶弄水踏混水撥盆雜藝散耍謳唱息器教水族飛禽水傀儡鬻道術煙火起輪走線流星水瀑風筝不可指數總謂之趕趂人蓋耳目不暇給焉御舟四垂珠簾錦幕懸挂七寶珠翠龍船梭子閙竿花籃等物宫姬韶部儼如神仙天香濃郁花栁避妍小舟時有宣喚賜豫如宋五嫂魚羮嘗經御賞人所共趨遂成富媪朱靜佳六言詩云栁下白頭釣叟不知生長何年前度君王逰幸賣魚收得金錢往往修舊京金明池故事以安太上之心豈特事逰觀之美哉湖上御園南有聚景真珠南屏北有集芳延祥玉壺然亦多幸聚景焉一日御舟經斷橋橋旁有小酒肆頗雅潔中飾素屏風書風入松一詞於上光堯駐目稱賞久之宣問何人所作乃太學生俞國寶醉筆也其詞云一春長費買花錢日日醉湖邊玉驄慣識西湖路驕嘶過沽酒樓前紅杏香中歌舞緑楊影裏鞦韆暖風十里麗人天花壓鬢雲偏畫船載取春歸去餘情付湖水湖煙明日重攜殘酒來尋陌上花鈿上笑曰此詞甚好但末句未免儒酸因為改定云明日重扶殘醉則迥不同矣即日命解褐云西湖天下景朝昏晴雨四序總宜杭人亦無時而不逰而春逰特盛焉承平時頭船如大緑間緑十樣錦百花寶勝明玉之類何翅百餘其次則不計其數皆華麗雅靚誇竒競好而都人凡締姻賽社會親送葬經會獻神仕宦恩賞之經營禁省臺府之囑託貴璫要地大賈豪民買笑千金呼盧百萬以至癡兒騃子密約幽期無不在焉日縻金錢靡有紀極故杭諺有銷金鍋兒之號此語不為過也都城自過收燈貴逰巨室皆爭先出郊謂之探春至禁煙為最盛龍舟十餘綵旗疊鼓交午曼衍粲如織錦內有曽經宣喚者則錦衣花帽以自别於衆京尹為立賞格競渡爭標內璫貴客賞犒無算都人士女兩堤駢集幾於無置足地水面畫楫櫛比如魚鱗亦無行舟之路歌歡簫鼓之聲振動逺近其盛可以想見若逰之次第則先南而後北至午則盡入西泠橋裏湖其外幾無一舸矣辨陽老人有詞云看畫船盡入西泠間却半湖春色蓋紀實也既而小泊斷橋千舫駢集歌管喧奏粉黛羅列最為繁盛橋上少年郎競縱紙鳶以相勾牽剪截以線絶者為負此雖小伎亦有專門爆仗起輪走線之戲多設於此至花影暗而月華生始漸散去絳紗籠燭車馬爭門日以為常張武子詩云帖帖平湖印晚天踏歌逰女錦相牽都城半掩人爭路猶有胡琴落後船最能狀此景茂陵在御略無逰幸之事離宫别館不復增修黃洪詩云龍舟大半設西湖此是先皇節儉圖三十六年安靜裏棹歌一曲在康衢理宗時亦嘗製一舟悉用香楠木槍金為之亦極華侈然終於不用至景定間周漢國公主得旨偕駙馬都尉楊鎮泛湖一時文物亦盛髣佛承明之舊傾城縱觀都人為之罷市然是時先朝龍舫久已沉沒獨有小舟號小烏龍者以賜楊郡王之故尚在其舟平底有柁製度簡朴或傳此舟每出必有風雨余嘗屢乘初無此異也放春蔣苑使有小圃不滿二𤱔而花朩匼匝亭榭竒巧春時悉以所有書畫玩器冠花器弄之物羅列滿前戲效關撲有珠翠冠僅大如錢者閙竿花籃之類悉皆縷絲玉金為之極其精妙且立標竿射垜及鞦韆梭門鬪雞蹴踘諸戲事以娛逰客衣冠士女至者招邀杯酒往往過禁煙乃已蓋效禁苑具體而微者也社會二月八日為桐川張王生辰霍山行宫朝拜極盛百戲競集如排緑社雜劇齊雲社蹴踘遏雲社唱賺同文社耍詞角抵社相朴清音社清樂錦標社射弩錦體社花繡英略社使棒雄辨社小説翠錦社行院繪革社影戲淨髮社梳剃律華社吟呌雲機社撮弄而七寶馬二會為最玉山寶帶尺璧寸珠璀璨奪目而天驥龍媒絨韀寶轡競賞神駿好竒者至剪毛為花草人物厨行果局窮極肴核之珍有所謂意思作者悉以通草羅帛雕飾為樓臺故事之類飾以珠翠極其精緻一盤至直數萬然皆浮靡無用之物不過資一玩耳竒禽則紅鸚白雀水族則銀蟹金龜高麗華山之竒松交廣海嶠之異卉不可縷數莫非動心駭目之觀也若三月三日殿司真武會三月二十八日東嶽生辰社會之盛大率類此不暇贅陳祭掃清明前三日為寒食節都城人家皆插栁滿簷雖小坊幽居亦青青可愛大家則加棗䭅於栁上然多取之湖隄有詩云莫把青青都折盡明朝更有出城人朝廷遣臺臣中使宫人車馬朝饗諸陵原廟薦獻用麥糕稠餳而人家上冢者多用棗䭅薑豉南北兩山之間車馬紛然而野祭者尤多如大昭慶九曲等處婦人淡裝素衣提攜兒女酒壺肴罍村店山家分餕逰息至暮則花栁土宜隨車而歸若玉津富景御園包家山之桃關東青門之菜市東西馬塍尼菴道院尋芳討勝極意縱逰隨處各有買賣趕趂等人野果山花别有幽趣蓋輦下驕民無日不在春風歌舞中而遊手末伎為尤盛也浴佛四月八為佛誕日諸寺院各有浴佛會僧尼輩競以小盆貯銅像浸以糖水覆以花棚鐃鈸交迎遍往邸第富室以小杓澆灌以求施利是日西湖作放生會舟楫甚盛略如春時小舟競賣龜魚螺蚌放生迎新户部點檢所十三酒庫例於四月初開煮九月初開清先是提領所呈樣品嘗然後迎引至諸所𨽻官府而散每庫各用匹布書庫名髙品以長竿懸之謂之布牌以木牀鐵擎為仙佛鬼神之類駕空飛動謂之臺閣雜劇百戲諸藝之外又為漁父習間竹馬出獵八仙故事及會妓家女使裹頭花巾為新好庫妓之琤琤者皆珠翠盛飾銷金紅背乘繡韀寶勒駿騎各有皂衣黃號私身數對訶導於前羅扇衣笈浮浪間客隨逐於後少年狎客往往簇飣持杯爭勸馬首金錢綵段霑及輿臺都人習以為常不為怪笑所經之地髙樓邃閣繡幕如雲纍足駢肩真所謂萬人海也端午先期學士院供帖子如春日禁中排當例用朔日謂之端一或傳舊京亦然插食盈架設天師艾虎意思山子數十座五色蒲絲百草霜以大合三層飾以珠翠葵榴艾花蜈蚣蛇蝎蜥蜴等謂之毒蟲及作糖霜韻果糖蜜巧粽極其精巧又以大金瓶數十遍插葵榴梔子花環繞殿閣又分賜后妃諸閣大璫近侍翠葉五色葵榴金絲翠扇真珠百索叉符經筒香囊軟香龍涎佩帶及紫練白葛紅蕉之類大臣貴邸均被細葛香羅蒲絲艾朵彩團巧粽之賜而外邸節物大率效尤焉巧粽之品不一至結為樓臺舫輅又以青羅作赤口白舌帖子與艾人並懸門楣以為禳禬道宫法院多送佩帶符篆而市人門首各設大盆雜植艾虎葵花上挂五色紙錢排飣果粽雖貧者亦然湖中是日遊舫亦盛蓋迤邐炎暑晏遊漸稀故也俗以此日為馬本命凡御廄邸第上乘悉用五彩為鬃尾之飾竒韀寶轡充滿道途亦可觀玩也禁中納涼禁中避暑多御復古選德等殿又翠寒堂納涼長松修竹濃翠蔽日層巒竒岫靜窈縈深寒瀑飛空下注大池可十𤱔池中紅白菡萏萬柄蓋園丁以瓦盎别種分列水底時易新者庶幾美觀又置茉莉素馨建蘭麝香藤朱槿玉桂紅蕉闍婆簷蔔等南花數百盆於廣庭鼓以風輪清芬滿殿御笐兩旁各設金盆數十架積雪如山紗厨後先皆懸挂伽蘭木真蠟龍涎等香珠百餘蔗漿金碗珍果玉壺初不知人間有塵暑也聞洪景盧學士嘗賜對於翠寒堂當三伏中體粟戰栗不可久立上問故笑遣中貴人以北綾半臂賜之則境界可想見矣都人避暑六月六日顯應觀崔府君誕辰自東都時廟食已盛是日都人士女駢集炷香巳而登舟泛湖為避暑之逰時物則新荔枝軍庭李二果産閩奉化項里之楊梅聚景園之秀蓮新藕蜜筒甜瓜椒核枇杷紫菱碧芡來禽金桃蜜漬昌元梅朩瓜豆兒水荔枝膏金橘水糰麻飲芥辣白醪涼水氷雪爽口之物關撲香囊畫扇涎花珠佩而茉莉為最盛初出之時其價甚穹婦人簇帶多至七插所直數十劵不過供一餉之娛耳蓋入夏則逰船不復入裏湖多占蒲深栁密寬涼之地披襟釣水月上始還或好事者則敞大舫設蘄簟髙枕取涼櫛髮快浴惟取適意或留宿湖心竟夕而歸乞巧立秋日都人戴楸葉飲秋水赤小豆七夕節物多尚果食茜雞及泥孩兒號摩㬋羅有極精巧飾以金珠者其直不資併以蠟印鳬雁水禽之類浮之水上婦人女子至夜對月穿針餖飣杯盤飲酒為樂謂之乞巧及以小蜘蛛貯合內以候結網之疏密為得巧之多少小兒女多衣荷葉半臂手持荷葉效顰摩㬋羅大抵皆舊俗也七夕前修內司例進摩㬋羅十桌每桌三十枚大者至髙三尺或用象牙雕鏤或用龍涎佛手香製造悉用鏤金珠翠衣帽金錢叉鋜佩環真珠頭髮及手中所執戲具皆七寶為之各護以五色鏤金紗厨制閫貴臣及京府等處至有鑄金為貢者宮姬市娃冠花衣領皆以乞巧時物為飾焉中元七月十五日道家謂之中元節各有齋醮等會僧寺則於此日作盂蘭盆齋而人家亦以此日祀先例用新米新醬冥衣時果綵段麵棊而茹素者幾十八九屠門為之罷市焉中秋禁中是夕有賞月延桂排當如倚桂閣秋暉堂碧岑皆臨時取旨夜深天樂直徹人間御街如絨線蜜煎香鋪皆鋪設貨物誇多競好謂之歇眼燈燭華燦竟夕乃止此夕浙江放一點紅羊皮小水燈數十萬盞浮滿水面爛如繁星有足觀者或謂此乃江神所喜非徒事觀美也觀潮浙江之潮天下之偉觀也自既望以至十八日為最盛方其逺出海門僅如銀線既而漸定則玉城雪嶺際天而來大聲如雷霆震撼激射吞天沃日勢極雄豪楊誠齋詩云海闊銀為郭江橫玉繫腰者是也每嵗京尹出浙江亭教閲水軍艨艟數百分列兩岸既而盡奔騰分合五陳之勢并有乘騎弄旗標槍舞刀於水面者如履平地倐爾黃煙四起人物略不相覩水爆轟震聲如崩山煙消波靜則一舸無迹僅有數舟為火所焚隨波而逝吳兒善泅者數百皆披髮文身手持十幅大綵旗爭先鼓勇泝迎而上出沒於鯨波萬仞中騰身百變而旗尾略不霑濕以此誇能而豪民貴宦爭賞銀綵江干上下十餘里間珠翠羅綺溢目車馬塞途飲食百物皆倍穹常時而僦賃看幕雖席地不容間也禁中例觀潮於天開圖畫髙臺下瞰如在指掌都民遙曕黃繖雉扇於九霄之上真若簫臺蓬島也重九禁中例於八日作重九排當於慶瑞殿分列萬菊燦然眩眼且點菊燈略如元夕內人樂部亦有隨花賞如前賞花例蓋賞燈之宴權輿於此自是日盛矣或於清燕殿綴金亭賞橙橘遇郊祀嵗則罷宴都人是月飲新酒泛茰簮菊且各以菊糕為饋以糖肉秫麵雜糅為之上縷肉絲鴨餅綴以榴顆標以綵旗又作蠻王獅子於上及糜栗為屑合以蜂蜜印花脫餅以為果餌又以蘇子微漬梅滷雜和蔗霜梨橙玉榴小顆名曰春蘭秋菊雨後新涼則已有炒銀杏梧桐子吟呌於市矣開爐是日御前供進夾羅御服臣僚服錦襖子夾公服授衣之意也自此御爐日設火至明年二月朔止皇后殿開爐節排當是月遣使朝陵如寒食儀都人亦出郊拜墓用綿毬楮衣之類冬至朝廷大朝會慶賀排當並如元旦儀而都人最重一陽賀冬車馬皆華整鮮好五鼓已填擁雜遝於九街婦人小兒服飾華炫往來如雲嶽祠城隍諸廟炷香者尤盛三日之內店肆皆罷市垂簾飲博謂之做節享先則以餛飩有冬餛飩年􅻞飥之諺貴家求竒一器凡十餘色謂之百味餛飩賞雪禁中賞雪多御明逺樓禁中稱楠木樓後苑進大小雪獅兒並以金鈴綵縷為飾且作雪花雪燈雪山之類及滴酥為花及諸事件並以金盆盛進以供賞玩并造雜煎品味如春盤餖飣羊糕兒酒以賜并於內藏庫支撥官劵數百萬以犒諸軍及令臨安府分給貧民或皇后殿别自支犒而貴家富室亦各以錢米犒閭里之貧者嵗除禁中以臘月二十四日為小節夜三十日為大節夜呈女童驅儺裝六丁六甲六神之類大率如夢華所載後苑修內司各進消夜果兒以大合簇飣凡百餘種如蜜煎珍果下至花餳萁豆以至玉杯寶器珠翠花朵犀象博戲之具銷金斗葉諸色戲弄之物無不備具皆極小巧又於其上作玉輅高至三四尺悉以金玉等為飾護以貼金龍鳳羅罩以竒侈求勝一合之費不啻中人十家之産止以資天顔一笑耳后妃諸閣又各進嵗軸兒及珠翠百事吉利市袋兒小樣金銀器皿并隨年金錢一百二十文旋亦分賜親王貴邸宰臣巨璫至於爆杖有為果子人物等類不一而殿司所進屛風外畫鍾馗捕鬼之類而內藏藥線一熱連百餘不絶簫鼓迎春雞人警唱而玉漏漸移金門已啓矣嵗晚節物臘月賜宰執親王三衙從官內侍省官并外閫前宰執等臘藥係和劑局方造進及御藥院特旨製造銀合各一百兩以至五十兩三十兩各有差伏日賜暑藥亦同都下自十月以來朝天門內外競售錦裝新厯諸般大小門神桃符鍾馗狻猊虎頭及金綵縷花春帖幡勝之類為市甚盛八日則市院及人家用胡桃松子乳菌柿栗之類作粥謂之臘八粥醫家亦多合藥劑侑以虎頭丹八神屠蘇貯以絳囊饋遺大家謂之臘藥至於餽嵗盤合酒擔羊腔充斥道路二十四日謂之交年祀竈用花餳米餌及燒替代及作糖豆粥謂之口數市井迎儺以鑼鼓遍至人家乞求利市至除夜則比屋以五色錢紙酒果以迎送六神於門至夜蕡燭籸盆紅映霄漢爆竹鼓吹之聲喧闐徹夜謂之聒聽小兒女終夕博戲不寐謂之守嵗又明燈牀下謂之照虛耗又書天行帖兒貼於門楣祀先之禮則或昏或曉各有不同如飲屠蘇百事吉膠牙餳燒术賣懵懂等事率多東都之遺風焉守嵗之詞雖多極難其選獨楊守齋一枝春詞最為近世所稱併書於此竹爆驚春競喧闐夜起千門簫鼓流蘇帳暖翠鼎緩騰香霧停杯未舉奈剛要送年新句應自賞歌字清圓未誇上林鶯語從他嵗窮日暮縱間愁怎減劉郎風度屠蘇辦了迤邐栁欣梅妬宫壺未曉早驕馬繡車盈路還又把月夕花朝自今細數武林舊事卷三
