body:
  text: 武林舊事卷六宋周宻撰諸市藥市炭橋花市官巷珠子市融和坊南官巷米市北闕門外黑橋頭肉市大瓦修義坊菜市新門外東青門霸子頭鮮魚行候潮門外魚行北闕門外水氷橋南猪行候潮門外北猪行打猪巷布市便門外横河頭蟹行新門外南土門花團官巷口錢塘門内青果團候潮門内泥路柑子團後市街鮝團便門外渾水閘書房橘園亭瓦子勾欄南瓦清冷橋熙春樓中瓦三元樓大瓦三橋街亦名上瓦北瓦衆安橋亦名下瓦蒲橋瓦亦名東瓦便門瓦便門外候潮門瓦候潮門外小偃門瓦小偃門外新門瓦亦名四通館瓦薦橋門瓦薦橋門外菜市門瓦菜市門外錢湖門瓦省馬院前赤山瓦後軍寨前行春橋瓦北郭瓦又名大通店米市橋瓦舊瓦石板頭嘉㑹門瓦嘉㑹門外北闗門瓦又名新瓦艮山門瓦艮山門外羊坊橋瓦王家橋瓦龍山瓦城内𨽻修内司城外𨽻殿前司如北瓦羊棚樓等謂之遊棚外又有勾欄甚多北瓦内勾欄十三座最盛或有路岐不入勾欄只在耍閙寛濶之處做塲者謂之打野呵此又藝之次者酒樓和樂樓昇暘宫南庫和豐樓武林園南上庫中和樓銀甕子中庫春風樓北庫太和樓東庫西樓金文西庫太平樓豐樂樓南外庫北外庫西溪庫以上並官庫屬户部㸃檢所毎庫設官妓數十人各有金銀酒器千兩以供飲客之用毎庫有祇直者數人名曰下畨飲客登樓則以名牌㸃喚侑樽謂之㸃花牌元夕諸妓皆併畨互移他庫夜賣各戴杏花冠兒危坐花架然名娼皆深藏邃閣未易招呼凡肴核杯盤亦各隨意攜至庫中初無庖人官中趂課初不藉此聊以粉飾太平耳往往皆學舎士夫所據外人未易登也熙春樓三元樓五門樓賞心樓嚴厨花月樓銀馬杓康沈店翁厨任厨陳厨沈厨巧張日新樓周厨鄭厨只賣好食雖海鮮頭羮皆有之虼䗫眼只賣好酒張花以上皆市樓之表表者毎樓各分小閣十餘酒器悉用銀以競華侈毎處各有私名妓數十輩皆時粧袪服巧笑争妍夏月茉莉盈頭香滿綺陌凭檻招邀謂之賣客又有小鬟不呼自至歌吟强聒以求支分謂之擦坐又有吹簫彈阮息氣鑼板歌唱散耍等人謂之趕趂及有老嫗以小爐炷香為供者謂之香婆有以法製青皮杏仁半夏縮砂荳䓻小蠟茶香藥韻薑砌香橄欖薄荷至酒閣分俵得錢謂之撒又有賣玉面貍鹿肉糟決明糟蟹糟羊蹄酒蛤蜊柔魚蝦茸􅤤乾者謂之家風又有賣酒浸江􅠪章舉蠣肉龜脚鎖管蜜丁脆螺鱟醬法鰕子魚䱥魚諸海味者謂之醒酒口味凡下酒羮湯任意索喚雖十客各欲一味亦自不妨過賣鐺頭記憶數十百品不勞再四傳喝如流便即製造供應不許少有違悮酒未至則先設㸔菜數楪及舉杯則又換細菜如此屢易愈出愈竒極意奉承或少忤客意及食次少遲則主人隨逐去之歌管歡笑之聲毎夕達旦往往與朝天車馬相接雖暑雨風雪不少减也歌館平康諸坊如上下抱劍營漆器牆沙皮巷清河坊融和坊新街太平坊巾子巷獅子巷後市街薦橋皆羣花所聚之地外此諸處茶肆如清樂茶坊八仙茶坊珠子茶坊潘家茶坊連三茶房連二茶坊及金沙橋等兩河以至瓦市各有等差莫不靚粧迎門争妍賣笑朝歌暮絃搖蕩心目凡初登門則有提瓶獻茗者雖杯茶亦犒數千謂之㸃花茶登樓甫飲一杯則先與數貫謂之支酒然後呼喚提賣隨意置宴趕趂祇應撲賣者亦皆紛至浮費頗多或欲更招他妓則雖對街亦呼肩輿而至謂之過街轎前輩如賽觀音孟家蟬吴憐兒等甚多皆以色藝冠一時家甚華侈近世目擊者惟唐安安最號富盛凡酒器沙鑼氷盆火箱粧盒之類悉以金銀為之帳幔茵褥多用錦綺器玩珍竒他物稱是下此雖力不逮者亦競鮮華盖自酒器首飾被卧衣服之属各有賃者故凡佳客之至則供具為之一新非曽逰者不察也賃物花檐酒檐首飾衣服被卧轎子布囊酒器幃設動用盤合䘮具凡吉凶之事自有所謂茶酒厨子專任飲食請客宴席之事凡合用之物一切賃至不勞餘力雖廣席盛設亦可咄嗟辦也作坊熟藥圓散生藥片飲麫團子饅頭爊炕鵝鴨爊炕猪羊糖蜜棗兒諸般糖金橘團灌肺饊子萁荳印馬蚊烟都民驕惰凡賣買之物多於作坊行販已成之物轉求什一之利或有貧而愿者凡貨物盤架之類一切取辦於作坊至晚始以所直償之雖無分文之儲亦可糊口此亦風俗之美也驕民都民素驕非惟風俗所致盖生長輦下勢使之然若住屋則動蠲公私房賃或終嵗不償一鐶諸務税息亦多蠲放有連年不收一孔者皆朝廷自行抱認諸項窠名恩賞有黄榜錢雪降則有雪寒錢久雨久晴則又有賑恤錢米大家富室則又隨時有所資給大官拜命則有所謂搶節錢病者則有施藥局童㓜不能自育者則有慈幼局貧而無依者則有養濟院死而無殮者則有漏澤園民生何其幸歟游手浩穰之區人物盛顆㳺手奸黠實繁有徒有所謂美人局以娼優為姬妾誘引少年為事櫃坊賭局以博戲闗撲結黨手法騙財水功徳局以求官覔舉恩澤遷轉訟事交易等為名假借聲勢脱漏財物不一而足又有買賣物貨以偽易真至以紙為衣銅鉛為金銀土朩為香藥變換如神謂之白日賊若闤闠之地則有剪脱衣囊環佩者謂之覔貼兒其他穿窬胠箧各有稱首以至頑徒如攔街虎九條龍之徒尤為市井之害故尹京政先彈壓必得精悍鈎鉅長於才術者乃可都轄一方有都轄使臣總轄供甲院長以至廂巡地分頭項火下凡數千人專以緝捕為職其間雄駔有聲者往往皆出羣盗而内司又有海巡八廂以察之市食鵪鶉餶飿兒肝臟􅥪子寛焦薄脆灌腸猪胰胡餅香藥灌肺窩絲薑豉剗子羊脂韭餅玲瓏雙條七色燒餅科斗細粉金錠裹蒸市羅􅥪兒雜煠糕糜旋炙􅘣兒八糙鵞鴨炙鷄鴨爊肝鑵裏爊爊鰻鱔爊團魚煎白腸水晶膾煎鴨子臓駞兒焦蒸餅海蟄鮓薑蝦米辣虀粉糖葉子豆糰麻糰螺頭膘皮辣菜餅炒螃蟹肉蔥虀羊血鹿肉􅘣子果子皂兒膏宜利少瓜蔞煎鮑螺裹蜜糖絲線澤州餳蜜麻酥炒團澄沙團子十般糖甘露餅玉屑膏爊朩𤓰糖脆梅破核兒查條橘紅膏荔枝膏蜜薑䜴韻姜糖花花糖二色灌香藕糖豌荳芽豆栗黄烏李酪麫蓼花蜜彈彈望口消桃穰酥重劑蜜棗兒天花餅烏梅糖玉柱糖乳糖獅子薄荷蜜琥珀蜜餳角兒諸色糖蜜煎菜蔬薑油多薤花茄兒辣𤓰兒倭菜藕鮓冬瓜鮓笋鮓茭白鮓皮醬糟瓜虀淡鹽虀鮓菜醋薑脂麻辣菜拌生菜諸般糟淹鹽芥粥七寳素粥五味粥栗米粥糖豆粥糖粥糕粥饊子粥􅘣鮓筭條界方條線條魚肉影戲胡羊􅘣削脯槌脯鬆脯兎􅘣麞􅘣鹿脯糟猪頭乾鹹豉皂角鋋臘肉炙骨頭旋炙荷包荔枝皮鵞鮓荷包旋鮓三和鮓切鮓骨鮓桃花鮓雪團鮓玉板鮓鱘鰉鮓春子鮓黄雀鮓銀魚鮓􅒕鮓凉水甘豆湯椰子酒豆兒水鹿梨漿滷梅水薑蜜水朩瓜汁茶水沈香水荔枝膏水苦水金橘團雪泡縮脾飲梅花酒五苓大順散香薷飲紫蘇飲糕糖糕蜜糕栗糕粟糕麥糕豆糕花糕糍糕雪糕小甑糕蒸糖糕生糖糕蜂糖糕線糕間炊糕乾糕乳糕重陽糕社糕蒸作從食子母蠒春蠒大包子荷葉餅芙蓉餅夀帯龜子母龜歡喜撚尖剪花小蒸作駱駝蹄大學饅頭羊肉饅頭細餡糖餡豆沙餡蜜辣餡生餡飯餡酸餡笋肉餡蕈餡棗栗餡薄皮蟹黄灌漿卧爐鵞項棗䭅仙桃乳餅菜餅秤錘蒸餅睡蒸餅千層雞頭籃兒鵞彈月餅餣子炙焦肉油餅燒餅火棒小蜜食金花餅市羅蜜劑餅餤春餅胡餅韭餅諸色􅥪子諸色包子諸色角兒諸色果食諸色名酒薔薇露流香並御庫宣賜碧香思春堂三省激賞庫鳳泉殿司玉練槌祠祭有美堂中和堂雪醅真珠泉皇都春出賣爰咨堂和酒出賣並京醖皇華堂浙西倉常酒出賣瓊花露揚州六客堂湖州齊雲青露雙瑞並蘇州愛山堂得江並東緫留都春静治堂並江閫十州春玉醅並海閫海岳春西總籌思堂江東漕清若空秀州蓬萊春越州第一江山北府兵厨錦波春浮玉春並鎮江秦淮春銀光並建康清心堂豐和春䝉泉並温州瀟灑泉嚴州金斗泉常州思政堂龜峰並衢州錯認水婺州穀溪春蘭溪慶逺堂秀邸清白堂楊府藍橋風月吴府紫金泉楊郡王府慶華堂楊駙馬府元勲堂張府眉夀堂萬象皆春並榮邸濟美堂勝茶並謝府㸃檢所酒息日課以數十萬計而諸司邸第及諸州供送之酒不與焉盖人物浩繁飲之者衆故也小經紀他處所無有選官圖班朝録供朝報寫牌額諸色科名開先牌織經帯裁板尺諸色指揮交牀試籃棋子棋盤蒱牌骰子諸般簿子賣字本掌記冊兒紙畫兒諸色經文刀册兒剪字扇牌兒印色盝纒令耍令琴阮絃開笛靚笙鞔鼓口簧位牌諸盤盝兒屋頭掛屏剪鏃花様簷前樂見成皮鞵提燈齪燈頭鬚編掠香櫞絡兒香櫞坐子柱杖粘竿風旛釣鈎釣竿食罩弔掛拂子蒲坐椅褥藥焙烘籃風袋煙帚糊刷鞋楦桶鉢搭羅兒薑擦子帽兒鞵帯修皮鞋穿交椅穿罣罳鞋結厎領抹釵朶牙梳穿珠洗翠修冠子小梳兒染梳兒接補梳兒香袋兒面花兒絹孩兒符袋兒畫梅七香丸膠紙穏步膏手皺藥凉藥香藥膏藥髪垜兒頭髪磨鏡弩兒弩絃彈弓箭翎射帖壺籌鵓鴿鈴風筝藥線象棋鞬子斗葉香爐灰紕刷兒篦子剔剪截斷尺出洗衣服簇頭消息提茶瓶鼓爐釘餅釘看窻札熨斗供香餅使緜打炭墼補鍋子泥竈整漏篐桶襻膊兒竹猫兒消息子老䑕藥蚊烟閙鵞兒凉筒兒紐扣子接縧修扇子錢索麻索紅索兒席草雞籠修竹作使法油油紙油單氊坐子修砧頭磨刀磨剪子擂槌俗諺云杭州人一日吃三十丈木頭以三十萬家為率約毎十家日吃擂槌一分合而計之則三十丈矣棒槌舂米劈柴淘井猫窩猫魚賣猫魚改猫犬鷄食魚食蟲食蟲蟻食諸般蟲蟻魚兒活虼蚪兒促織兒小螃蟹金麻馬􅘪兒蝍蟟蟲蟻籠促織盆麻花子荷葉燈草發燭肥皂團茶花子買瓶掇舊鋪襯圪伯紙竹釘淘灰土淘河剔撥义黄牛糞灰挑疥蟲賣烟火鏇影戲若夫兒戲之物名件甚多尤不可悉數如相銀杏猜糖吹呌兒打嬌惜千千車輪盤兒毎一事率數十人各專藉以為衣食之地皆他處之所無也諸色技藝人御前應制姜梅山特立觀察使周葵窗端臣曹松山蘧陳藏一郁徐良陳愛山程奎耿待聘御前畫院馬和之蘇漢臣李安中陳善林春吴炳夏圭李廸馬逺馬璘武林舊事巻六
