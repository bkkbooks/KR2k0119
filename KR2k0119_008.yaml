body:
  text: 武林舊事卷八宋周密撰車駕幸學先期三日儀鑾司及內侍省官至國子監相視八廂亦至學中搜檢次日諸齋生員盡行般出學外安泊各齋門並用黃封學官預擬御課題咸淳丁卯出辟雍揚緝熙賦用黃羅裝背大册面簽云太學某齋生臣姓某供以大黃羅袱護之置於各齋之前以備駕至點索崇化堂後即聖駕歇泊之所皆設御屏黃羅幃設供御等物凡敕入宫門號止於國子監外門敕入殿門號止於國子監內門敕入禁衛號止於崇化堂天井謂之隔門除司業祭酒外其餘學官前廊長諭並帶黃號於隔門外席地坐賜酒食三品以俟迎駕駕至純禮坊隨駕樂部參軍色念致語雜劇色念口號起引子𨗳駕至大成殿櫺星門禮部太常寺官國子監三學官及三學前廊長諭率諸生迎駕起居上乘輦入門至大成殿門降輦有旨免鳴鞭以昭至敬閣門太常禮直官前𨗳入御幄太常卿跪奏稱太常卿臣某言請皇帝行酌獻禮上出御幄升殿詣文宣王位前三上香跪受爵三祭酒奠酌兩拜在位皆兩拜降階歸幄太常卿奏禮畢陪位官並退上乘輦鳴鞭入崇化堂降輦入幄更衣上所至皆設御幄禮官國子監官三學官三學生並於堂下分東西立次引執經官講書官於堂下東壁面西立宰臣執政以下北向立閣門奏班齊上服帽紅上蓋玉束帶絲鞋出崇化堂坐宰臣以下宣名奏聖躬萬福御藥傳旨宣升堂各兩拜贊賜坐分東西階升堂席後立次引執經官講書官奏萬福官該宣名者即宣名兩拜次引國子監三學官并三學生奏萬福兩拜分引升兩廊席後立內官進書案聽宣以經授執經官進於案上講筵內承受對展經册入內官進牙界方舍人輩賜坐宰相以下及兩廊學官生員應喏訖各就坐聽講講書官進讀經義執經官執牙篦執讀入內官收徹經書再以講義授講官講書官指講訖入內官徹書堂上兩廊官並起分行宰臣以下降階講書官當御前躬身致詞北向立兩拜御藥傳旨宣坐賜茶訖舍人贊躬身不拜各就坐分引升堂席後立兩拜各就坐翰林司供御茶訖宰臣以下并兩廊官贊喫茶宰臣以下降階北向立御藥傳旨不拜引兩廊官北向各再拜訖出皇帝起易服幞頭上蓋玉帶絲鞋乘輦鳴鞭出學百官諸生迎駕如前隨駕樂部參軍色念迎駕致語雜劇色念口號曲子起夀同天引子導駕還宫在學前廊並該恩出官諸生各有免解恩例餘並推恩有差人使到闕北使到闕先遣伴使賜御筵於赤岸之班荆館中使傳宣撫問賜龍茶一斤銀合三十兩次日至北郭稅亭茶酒上馬入餘杭門至都亭驛中使傳宣賜龍茶銀合如前又賜被褥銀沙鑼等明日臨安府書送酒食閣門官説朝見儀投朝見榜子又明日入見於紫宸殿見畢赴客省茶酒遂賜宴於垂拱殿酒五行從官以上與坐是日賜茶酒名果又賜副使衣各七事幞頭牙笏二十兩金帶一條并金魚袋靴一雙馬一匹鞍轡一副共折銀五十兩銀沙鑼五十兩色綾絹一百五十匹餘并賜衣帶銀帛有差明日賜牲餼折博生羅十匹綾十匹絹布各二匹朝見之二日與伴使偕往天竺寺燒香賜沈香三十兩并齋筵乳糖酒果次至冷泉亭呼猿洞逰賞次日又賜內中酒果風藥花餳赴守嵗夜筵用傀儡元正朝賀禮畢遣大臣就驛賜御筵中使傳宣勸酒九行三日客省簽賜酒食禁中賜酒果遂赴浙江亭觀潮酒七行四日赴玉津園燕射命善射者假官伴之賜弓矢酒行樂作伴射與大使射弓館伴與副使射弩酒九行五日大燕集英殿尚書郎官監察御史以上並與學士院撰致語六日裝班朝辭退賜襲衣金帶三十兩銀沙鑼五十兩紅錦二色綾二匹小綾十色絹三十匹雜色絹一百匹餘各有差臨安府書送贈儀復遣執政就驛賜燕晚赴解換夜筵伴使始與親勸酬且以衣物為賄謂之私覿次日賜龍鳳茶金銀合乘馬出北關登舟又次日遣近臣賜御筵自到闕至朝辭密賜大使銀一千四百兩副使八百八十兩衣各三襲金帶各三條都管上節各銀四十兩衣兩襲中下節各銀三十兩衣一襲塗金帶副之宮中誕育儀例略宮中凡閣分有娠將及七月本位醫官申內東門司及本位提舉官奏聞門司特奏再令醫官指定降誕月分訖門司奏排辦産閣及照先朝舊例三分減一於內藏庫取賜銀絹等物如後羅二百匹絹四千六百七十四匹釘設産閣月三朝晬一臘晬二臘三臘滿百頭金二十四兩八錢七分二釐裹木幹枝篦鈴鋜銀眼鍍盆銀四千四百四十兩銀錢三貫足大銀盆一面醽醁沈香酒五十三石二斗八升裝畫扇子一座裝畫油盆八面簇花生色袋身單袋一付催生海馬皮二張檀香匣盛唾銅剃刀二把金鍍銀鎖鑰全彩畫油栲栳簸箕各一彩畫油甎八口彩畫油瓶二新羅漆馬銜鐵一副裝畫胎衣瓶鐵稱錘五箇鐵鈎五十條眠羊卧鹿二合各十五事金銀果子五百箇影金貼羅散花兒二千五百錦沿席一緑席氊繡合褥子各二碼瑙纈絹一匹大氊四領乾蓐草一束雜用盆十五箇暖水釡五箇緑油栁朩槌十箇生菜一合生艾一斤生母薑二斤黑豆一斗栲栳全無灰酒二瓶米醋二瓶紐地黃汁布二條濾藥布二條金漆箱兒全香墨十鋌紅羅影金匣雞子五十箇金漆箱兒小石子三十顆竹籠作竹紫五十把紅布袋二盛馬通未用帶泥藕十挺生芋子一合彩畫銀杏一合五十斤內裝畫一千箇嘉慶子五十斤內裝畫七百箇菱米五十斤內裝畫七百箇胡桃二千箇裝畫圓眼五十斤裝畫荔枝五十斤蓮肉五十斤栗子五十斤果子十合喫食十口蒸羊一口生羊剪花豆八節羊文色子棗豌棗塔兒髓糖餅棗炊餅兒糕餅浮圖仍令太醫局差産科大小方脈醫官宿直供畫産圖方位飲食禁忌合用藥材催生物件令本位踏逐老娘伴人乳婦抱女洗人等申學士院撰述淨胎髮祝夀文排辦産閣了畢犒賜修內司會通門官本司人吏庫子醫官儀鸞司等人銀絹官會有差候降誕日本位官即便申內東門司轉奏降誕三日一臘兩臘四節次折産閣三臘滿月二次百晬頭晬以上十次支賜銀絹仍添本位聽宣內人請給十分以上並係常例此外特恩臨時取旨不在此限外廷儀禮不在此內册皇后儀先一日宣押翰林院學士鎖院草册后制詞賜學士潤筆金二百兩次日百官聽宣布皇后三辭不允差官奏告天地宗廟社稷諸陵太史局擇日先期命有司陳設至日早文武百僚集於大慶殿門外節次贊引執事官入立班定皇帝自內服幞頭紅袍玉帶靴入幄更服通天冠絳紗袍禮部侍郎奏中嚴外辦禮儀使俯伏跪稱禮儀使臣某言請皇帝發册餘與德夀宮上册寶禮儀並同侍中詣御座前躬身承旨訖降東階立稱有制皆再拜太傅太保躬身侍中宣制曰册妃某氏立為皇后命公等持節展禮太傅太保再拜參政帥掌節者脫節衣詣太傅位掌節者以節授參政參政奉節西向以節授太傅太傅受訖以節授掌節者次中書令以册授太傅太傅受訖置於案次侍中轉寶授太保並如前儀復位並再拜持節者前𨗳册寶進行太傅押册太保押寶正安樂作由中道出文德殿東偏門樂止掌節者加節衣至穆清殿外幄次初册寶出門禮儀使至御座前跪奏禮儀使臣某言禮畢內侍承旨索扇扇合簾降鳴鞭協律郎舉麾鼓柷乾安樂作皇帝降坐入東房戛敔樂止侍中版奏解嚴是日至穆清殿設樂架黃麾仗皇帝常服乘金龍肩輿至穆清殿後西閣內命婦等應陪者列奉從至閣內侍中版奏中嚴外辦應行事執事官各就門外位立定持節者立於左內命婦各就位皇后首飾褘衣內侍引司言司言引尚宫尚宫引皇后出閣協律郎舉麾坤安樂作由西房至殿上南向立定樂止禮直官引太傅太保就內給事前西向跪稱册使太傅某副使太保某奉制授皇后前備物典册俯伏興退復位內給事詣皇后前跪奏如前次太傅以册授內侍內侍授册舉册官奠册舉案俱詣內謁者監位以册授內謁者監受册奠訖次太保轉寶授內謁者監如前儀掌節者脫節衣以節授掌節內侍前𨗳册寶進行入殿門內謁者監都大主管後從以次入殿宜安樂作至位樂止尚宫引皇后自東階至殿下中褥位北向承安樂作至位樂止舉册寶官並案進於皇后之右少前西向跪奠訖內侍稱有制后再拜讀册官跪宣册文后又再拜次內謁者監奉册授皇后皇后受訖以授司言次奉寶授皇后皇后受訖樂止皇后再拜退內侍以謝皇太后箋授皇后皇后置於案再拜內侍奉表以出次進謝皇帝表如前內侍奏禮畢次尚宫引皇后升堂和安樂作司寶奉寶至於坐前樂止司賔引內命婦次就位班首初行惠安樂作至位樂止命婦皆再拜司贊引班首升階惠安樂作樂止進當皇后北向致詞稱贊降自西階惠安樂作至位樂止內外命婦皆再拜司言稱令旨命婦皆再拜宣令旨訖又皆再拜司賔以次引命婦還宮惠安樂作出門樂止次內侍引外命婦出咸安樂作至階上樂止北向致詞咸安樂作降階樂止外命婦皆再拜又宣答如前內侍奉禮畢皇后降坐徽安樂作皇后歸閣泰安樂作至閣樂止受賀畢皇后更常服升坐命外命婦如宫中儀會畢再拜以次出皇后歸謁家廟用咸淳全后例太史局預擇日降旨命禮寺參酌禮典所屬排辦至日皇后出宫至祥曦殿上升龍簷出和寧門至皇后家廟本府幹辦使臣等並穿秉兵士並衫帽於大門外香案前排立俟儀衛至各兩拜本府親屬於門內婦人於廳下側立候龍簷升廳至堂門降簷入幄次少歇次本府親屬並立幄前興居退詣家廟以俟陪立次本閣官奏請皇后服團冠背兒乘小車入詣家廟內侍傳呼樂官樂作西階降車樂止皇后升堂西向立樂作兩拜陪位官各兩拜讀祝文兩拜陪坐各兩拜如上儀樂作樂止如上皇后還位再拜陪位官各兩拜皇后降東側階升車樂止又詣後堂炷香如前儀次赴賜筵皇后坐於堂中南向堂前施簾親屬並常服詣廳下南向謝恩俟皇后升堂詣簾前兩拜婦人於簾內兩拜親屬並繫鞋立定以俟就坐供進酒食如家人禮至第五盞各於席前立俟皇后降坐少歇再坐並如前儀又至第九盞酒畢並靴笏各兩拜賜筵賜物次於廳前排立謝恩各兩拜俟皇后出幄乘龍簷親屬北向兩拜退皇后還內詣御前謝恩進納御前及送諸閣分夫人御侍韶部職事內人及諸位次內人本殿內人並細色匹帛盤盞細果海鮮時新喫食及支給內侍省大官以下及本殿官吏銀絹有差次日內降旨揮皇后封贈三代親屬並行推恩早泛索皇后下飯七件小楪兒五件菜蔬五件菜果十合親屬各果食十味賜筵皇后繡髙飣十時果十楪脯臘十楪細京果十楪細蜜煎十楪看果十楪親屬京果四十壘脯臘三百楪時果乾果共五百楪初坐皇后下酒喫食九盞上細看食十件果子意思十件歇坐皇后下酒喫食十盞果子十件時果十件宣賜拆食錢大官四員閣長以下十三員皇后閣內人押班等二十五人本殿隨從官儀鑾司官御酒庫官御輦院官御厨官翰林司官祇候庫官講殿幕士樂官賜筵樂次家廟酌獻三盞諸部合長生樂引子賜筵初坐蕙蘭芳引子第一盞觱栗起玉漏遲慢笛起側犯笛起真珠髻觱栗起栁鶯穿合喜慶曲破對舞第二盞觱栗起聖夀永歌曲子琵琶起傾杯樂第三盞琵琶起憶吹簫觱栗起獻仙音第四盞琵琶獨彈夀千春笛起芳草渡念致語口號勾雜劇時和等堯舜禹湯斷送萬嵗聲合意思副末念雨露恩濃金穴貴風光逺勝馬侯家第五盞觱栗起賣花聲笛起魚水同歡歇坐第一盞觱栗起合小唱簾外花第二盞琵琶獨彈無疆夀第三盞筝琶方響合雙雙燕神曲第四盞唱賺第五盞鼓板觱栗合小唱舞楊花再坐第六盞笙起夀南山方響起安平樂第七盞筝彈會羣仙笙起吳音子勾雜劇吳國寶等做年年好斷送四時歡合意思副末念香生