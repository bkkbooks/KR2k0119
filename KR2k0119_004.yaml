body:
  text: 武林舊事巻四宋周宻撰故都宮殿門麗正南門和寜北門東華東門西華西門苑東苑西北宮南宫南水門東水門㑹通上閤宣徳隔門斜門闗門玉華閣含和貽謨二門係天章閣殿垂拱常朝四參文徳六參宣布大慶明堂朝賀紫宸生夀集英策士以上謂之正朝亦有隨事更名者後殿延和宿齋避殿崇政即祥曦福寜寢殿復古髙宗建選徳孝宗建御屏冇監司郡守姓名緝熙理宗建熙明即修政度宗建明華清熙膺福慶瑞即順慶理宗改射殿需雲大燕符寳貯恭膺天命之寳嘉明度宗以繹已堂改明堂即文徳合祭改坤寜皇后穠華皇后慈明楊太后累朝母后皆旋更名慈元謝太后仁明全太后進食即勤政欽先神御孝思神御清華堂翠寒高宗以日本羅木建古松數十株澄碧觀堂芳春凌寒鍾美牡丹燦錦海棠燕喜静華清賞稽古御書院清逺清徹澄碧水堂蕊淵環秀山堂文明御書院書林御書院華館衍秀披香徳勤雲錦荷堂李陽氷書額清霽萼緑華梅堂李陽氷書額度宗易名瓊姿碧琳凝光澄輝繡香呈芳㑹景青花石柱香楠袱額瑪瑙石砌正始后殿謝后改夀寜殿怡然惠順位信美婉容位齋損齋高宗建彛齋謹習齋燕申齋樓博雅書樓觀徳萬景清暑清美明逺倚香閣龍圖太祖太宗天章真宗並祀祖宗神御寳文仁宗顯謨神宗徽猷哲宗敷文徽宗煥章高宗華文孝宗寳謨光宗寳章寜宗顯文理宗雲章度宗御書清華凌虚清漏倚桂來鳳觀音芙蓉萬春太后殿臺欽天奉天宴春秋芳天開圖畫舒嘯蹌臺軒晚清閤清華睿思怡真容膝受釐緑綺觀雲濤亭清泳清趣清暉清顥清迥清隠清寒清激放水清翫清興静香静華春妍春華春陽春信梅融春㝷春映春餘春留春皆春寒碧寒香香瓊香玉梅香界碧岑灧碧魚池瓊英瓊秀明秀深秀假山衍秀濯秀錦煙錦浪桃花繡錦萬錦麗錦叢錦照糚海棠浣綺綴金橙橘綴瓊梨花穠香暗香晚節香菊巖香桂雲岫山亭映波含暉達觀秀野凌寒梅竹涵虚平津真賞芳逺垂綸近池魚樂池上噴雪放水流芳芳嶼山子玉質此君竹聚芳延芳蘭亭激湍崇峻惠和浮醴泛羽並流盃亭凌穹山頂迎薫會英正己射亭丹暉凝光雪逕梅參月共樂迎祥瑩糚植杖村莊可樂文杏壺中天别是一家春度宗初剏或謂此非佳䜟也未幾果騐園小桃源觀桃杏塢梅岡瑤圃村莊桐木園菴寂然怡真坡瑪瑙洗馬橋萬嵗清平春波玉虹泉穗泉御舟蘭橈荃橈旱船教場南教場北教場禁中及徳夀宮皆有大龍池萬嵗山擬西湖冷泉飛來峰若亭榭之盛御舟之華則非外間可擬春時競渡及買賣諸色小舟並如西湖駕幸宣喚錫賚鉅萬大意不欲數蹕勞民故以此為奉親之娱耳御園聚景園清波門外孝宗致養之地堂扁皆孝宗御書淳熙中屢經臨幸嘉泰間寜宗奉成肅太后臨幸其後並皆荒蕪不修高疎寮詩云翠華不向苑中來可是年年惜露臺水際春風寒漠漠官梅却作野梅開㑹芳殿瀛春堂攬逺堂芳華堂花光亭八角瑤津翠光桂景灧碧凉觀瓊芳彩霞寒碧栁浪橋學士橋玉津園嘉㑹門外紹興間北使燕射於此淳熙中孝宗兩幸紹熙中光宗臨幸富景園新門外孝宗奉太后臨幸不一俗呼東花園屏山園錢湖門外以對南屏山故名理宗朝改名翠芳園餘見西湖門玉壺園錢塘門外本劉鄜王園有明秀堂餘見西湖門集芳園葛嶺元係張婉儀園後歸太后殿内有古梅老松甚多理宗賜賈平章舊有清勝堂望江亭雪香亭等餘見西湖門瓊華園小隠園延祥園西依孤山為林和靖故居花寒水潔氣象幽古三朝臨幸餘見西湖門瀛嶼在孤山之椒舊名凉堂四壁蕭照畫山水理宗易今名今為太乙宮黄庭殿挹翠堂舊名黒漆堂理宗御書清新舊六椽堂香月倚裏湖舊名水堂理宗御書香逺舊秀蓮亭白蓮堂六一泉堂檜亭梅亭上船亭東西車馬門西村水閣御舟港林逋墓陳朝檜有御書詩金沙井瑪瑙坡六一泉髙疎寮詩云水明一色抱神州雨壓輕塵不敢浮山北山南人喚酒春前春後客凭樓射熊館暗花扶扆下鵠池深栁拂舟白髮邦人能道舊君王曽奉上皇逰徳夀宫孝宗奉親之所聚逺樓髙宗雅愛湖山之勝恐數蹕煩民乃於宫内鑿大池引水注之以象西湖冷泉疊石為山作飛來峰因取坡詩賴有髙樓能聚逺一時收拾與閒人名之周益公進端午帖子云聚逺樓髙面面風冷泉亭下水溶溶人間炎熱何由到真是瑤臺第一重孝宗御製冷泉堂詩以進髙宗和韻真盛事也香逺堂荷清深堂竹松菊三徑菊芙蓉竹梅坡月榭清妍荼䕷清新桂芙蓉岡以上並東地分射㕔載忻堂御宴之所臨賦荷池粲錦金林檎至樂池上清曠半綻紅郁李㵼碧金魚池以上並南地分冷泉堂古梅文杏館静樂牡丹浣溪海棠以上並西地分絳華羅木堂旱船俯翠茅亭以上並北地分重華宫孝宗内禪所居即徳夀宫慈福宫憲聖夀成二太后所居即重華宫夀慈宫即慈福宫初改重夀殿東宫資善堂鳳山樓榮觀堂玉淵堂清賞堂新益堂繹已堂射圃乾淳教坊樂部雜劇色徳夀宫劉景長使臣王喜保儀郎頭名都管使臣又名公謹號玩隠老人茅山童茅芽頭蓋門貴蓋門慶末侯諒次末侯大頭張順曹辛宋興燕子頭李泉現引並舞三臺衙前龔士美使臣都管劉思深都管陳嘉祥節級吴興祐徳夀宫引兼舞三臺吴斌金彦昇管幹教頭王青孫子貴引潘浪賢引兼末部頭焦色金王賜恩引胡慶全蠟燭頭周泰次郭名顯引宋定次徳夀宫蚌蛤頭劉信副都頭成貴副陳烟息副大口王侯喜副孫子昌副末節級楊名髙末宋昌榮副歡喜頭前教坊伊朝新王道昌前鈞容直杵榖豐五味粥李外善和顧劉慶次劉衮梁師孟朱和次貼衙前鱔魚頭寗貴寗钁蔣寜次貼衙前利市頭司進絲𤓰兒郝成次貼衙前小鍬髙門興髙明燈檐搭兒髙門顯羔兒頭張舜朝趙民歡司政仙鶴兒劉貴段世昌段子貴龔安節嚴父訓宋朝清宋昌榮二名守衙前周旺丈八頭卞疇宋吉伊俊汪泰王原全次貼衙前王景鄭喬王來宣張顯守闕祇應黑俏焦喜焦梅頭歌板色徳夀宫李行髙兼笛衙前王信兼拍拍板色徳夀宫劉益使臣謝春澤衙前吴興祖節級趙永花成時世俊守闕節級前鈞容直崔喜琵琶色衙前豪師古兼琵琶徳夀宫胡永年武功大夫謝聖澤衙前焦達部頭趙昌祖段從善和顧吴良輔豪士英曹彦國簫色衙前曽延慶部頭劉珦周濟部頭和顧朱世昌兼筝王謹劉宗旺周亨陳籥嵇琴色徳夀宫曹友聞承節郎守闕都管衙前楊春和人員守闕都管魏國忠節級兼舞孫良佐石俊馮師賢和顧劉運成趙進惠和馮師賢王處仁筝色徳夀宫朱邦直忠訓郎衙前張行福部頭豪士良髙俊前教坊聶廷俊前鈞容直李吉笙色徳夀宮湯士成孫顯祖衙前宋世寜節級豪師古兼琵琶傅紹管幹人鄧孝仁趙福兼徳夀宫前鈞容直吴勝前教坊劉永顯和顧張世宗康彦和王興祖觱篥色徳夀宫田正徳教坊大使鞠思忠孫慶祖劉舜俞陳永良衙前李祥守闕節級仇彦節級王恩節級李和部頭時世榮部頭王正徳王道和慢守恭李遇金宗信兼徳夀宫鄭彦兼拍板張勻劉道曹彦興吴良佐朱貴管幹人孟誠陳祐丘彦管幹人鄧孝元王永周賢良陳師賢陳永良前教坊戚興道李彦美郭席珍前鈞容直王宣唐政和顧于慶兼舞馮宣王椿倪潤李祥守闕節級陳繼祖季倫張彦明陳良璹馮異商翼時世顯王文信王延慶謝潤張榮第三名守闕衙前時顯祖任再興費仍裕李樂正蔡邦彦鄭彬時允恭金潤王夀王思齋于成孫良輔崔顯盧茂春王師忠宋康寜張端顧宣王仲禮郭達宗劉順守闕衙前笛色徳夀宫元守正忠翊郎孫福使臣孫繼祖張行謹衙前都管孫福使臣朱榛人員守闕都管張守忠節級楊勝節級王喜節級張師孟部頭岳興部頭李智友段從禮朱順陳俊雷興祖王仕寜時寳部頭兼徳夀宫孫進郭彦楊選兼徳夀宮金儀趙俊守闕節級趙順楊元慶時定趙興祖陰顯祖丘遇徐識孫顯王筠兼徳夀宫拍板張榮郭亨元舜道前教坊金宗訓俞徳謝祖良曽延廣李進前鈞容直王喜俞徳兾恩和顧張億茆慶張師顔劉國臣趙昌張廣元舜臣沈琮杖頭胡良臣王師仲徐亨張義林顯鄭青陳士恭巫彦朱世榮朱紹祖翟義張孝恭汪定費興李昇馮士恭陳寳楊善尹師授張介賀宣朱榮朱元守闕衙前軒定鼔板張成鼓板閻興鼔板王和鼔板陳煥張世亨許珍張淵孫顯宗崔成守闕衙前方響色徳夀宫齊宣田世榮衙前葛元徳部頭于喜齊宗亮管幹人前鈞容直髙福和顧馬仲榮尹朝于通劉才髙杖鼓色徳夀宫張名髙孟清衙前髙宣節級時思俊守闕節級部頭兼板程盛齊喜孟文叔守闕節級時和鄧友端徐宗旺吴興福兼徳夀宮鄧世榮張興禄管幹人葉喜兼徳夀宫前教坊鞠端前鈞容直閻興邢智和顧張士成張潤張義張世昌張世顯孫榮段錦新蔡顯宗齊宗景郭興祖時康寜髙潤張皋傅良佐李晉臣思芸范琦段錦大鼓色徳夀宫張佑李吉衙前董福部頭李進周均小唱張佑兼徳夀宫和顧趙慶鼔兒劉成孫成鼓兒習學大鼔王富勾般習學大鼓尹師聰鼓兒張守道唱道情張昇鼔兒宋棠掌儀下書冩文字喻祥小唱錢永守闕衙前舞旋嵇琴魏國忠琵琶豪士英並兼舞三臺徳夀宫劉良佐武徳郎衙前杜士康和顧于慶雜劇三甲劉景長一甲八人戲頭李泉現引戲吴興佑次净茆山重侯諒周泰副末王喜裝旦吴子貴盖門慶進香一甲五人戲頭孫子貴引戲吴興佑次浄侯諒副末王喜内中祇應一甲五人戲頭孫子貴引戲潘浪賢次浄劉衮副末劉信潘浪賢一甲五人戲頭孫子貴引戲郭名顯次浄周泰副末成貴築毬三十二人左軍一十六人毬頭張俊蹺毬王憐正挾朱選副挾施澤左竿網丁詮右竿網張林散立胡椿等右軍一十六人毬頭李正蹺毬朱珍正挾朱選副挾張寜左竿網徐賔右竿網王用散立陳俊等雜班雙頭侯諒散耍劉衮劉信小樂器嵇琴曹友聞簫管孫福􅌙劉運成拍侯諒鼓板衙前一火笛楊勝張思孟拍張順和顧二火笛張成老僧閻俊望伯張喜鼓兒張昇笛王和小四鼓兒孫成換僧拍張榮狗兒馬後樂拍板吴興祖觱篥田正徳孫慶祖陳師授笛孫福時寳元守正提鼓孫子貴札子孟清時世俊髙宣吴興福張興禄内中上教博士王喜劉景長曹友聞朱邦直孫福吴永年各支月銀一十兩雜劇王喜侯諒吴興福吴興佑劉景長張順拍板田正徳謝春澤琵琶胡永年舞劉良佐嵇琴曹友聞楊春和筝朱邦直方響齊宣笙湯士成􅌙劉運成觱篥孫慶祖笛孫福時寳掌儀範等合千人掌儀範朱邦直曹友聞元守正孫福朱榛守闕衙前都管劉思深孫福王公謹守闕管幹教頭朱貴張興禄丘彦傅紹齊宗亮逐色部頭劉信趙永焦進周濟楊春和宋世寧李和時世榮時寳岳興葛元徳髙宣董福時世俊杜士康潘浪賢武林舊事巻四
