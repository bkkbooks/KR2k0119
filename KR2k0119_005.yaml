body:
  text: 武林舊事巻五宋周宻撰湖山勝槩南山路自豐樂樓南至暗門錢湖門外入赤山煙霞石屋止南髙峰方家峪大小麥嶺並附於此豐樂樓舊為衆樂亭又改聳翠樓政和中改今名淳祐間趙京尹與􅊸重建宏麗為湖山冠又甃月池立秋千梭門植花朩構數亭春時㳺人繁盛舊為酒肆後以學館致争但為朝紳同年㑹拜鄉㑹之地林暉施北山皆有賦趙忠定栁梢青云水月光中煙霞影裏湧出樓臺空外笙簫雲間笑語人在蓬萊天香暗逐風回正十里荷花盛開買箇小舟山南逰遍山北歸來吴夢窻嘗大書所賦鶯啼序於壁一時為人傳誦湖堂舊在聳翠樓側又有集賢亭今並不存呂洞賔祠舊傳洞賔嘗至此靈芝崇福寺錢王故苑以芝生其間捨以為寺故名靈芝髙宗孝宗嘗到凡四臨幸有浮碧軒依光堂赤為新進士㑹拜題名之所朱静佳有詩云黄金匝地小橋通四面清平納逺空雲氣常扶天子座日光浮動梵王宮殘碑幾字莓苔雨清磬一聲楊栁風沙鳥不知行樂事背人飛過夕陽東顯應觀祀磁州神崔府君六月六日生朝逰人甚盛咸淳間改昭應今歸靈芝寺舊有蕭照山水及蘇漢臣畫壁今不復存矣楊郡王府上船亭聚景園詳見御園門靈應堂俗呼包道堂寳蓮院紫霄宮廨院寳成院舊名釋伽興福院永隆院慧光尼庵張循王府省馬院船步内有正覺超化二院長橋妙浄院寳徳寺楊和王重建充三衙建聖節道場希夷道堂劉蓑衣建於南屏園左今移於此真珠園有真珠泉髙寒堂杏堂水心亭御港曽經臨幸今歸張循王府南園中興後所剏光宗朝賜平原郡王韓侂胄陸放翁為記後復歸御前改名慶樂賜嗣榮王與苪又改勝景有許閒堂和容射㕔寒碧臺藏春門凌風閣西湖洞天歸耕莊清芬堂嵗寒堂夾芳豁望矜春鮮霞忘機照香堆錦逺塵幽翠紅香多稼晚節香等亭秀石為山内作十様錦亭并射圃流杯等處弁陽翁詩云清芬堂下千株桂猶是韓家舊賜園白髮老翁和淚説百年中見兩平原又云舊事凄凉尚可㝷斷碑空卧草深深凌風閣下槎牙樹當日人疑是水沉雷峰顯嚴院郡人雷氏所居故名雷峰錢王妃建寺築塔名王妃塔或云地産黄皮遂譌為黄皮塔山頂有通𤣥亭望湖樓普寜寺又名白蓮有鐵塔一石塔二雲濤觀浄相院舊名瑞相有無盡意閣娱客軒一段竒軒幽深可喜今皆不存上清宫葛仙煉丹舊址道士胡瑩微祖築菴鄭丞相清之曽此讀書淳祐中重建賜今額理宗御書清浄道場甘園内侍甘昇園又名湖曲曽經臨幸至今有御愛松望湖亭小蓬萊西湖一曲後歸趙觀文又歸謝節使弁陽翁詩云小小蓬萊在水中乾淳舊賞有遺踪園林幾換東風主留得庭前御愛松御船坊理宗御舟在焉浄慈報恩光孝禪寺孝宗常臨幸山曰南屏有慧日峰舊名慧日永明太宗賜夀寜院額孝宗御書慧日閣有千佛閣五百羅漢堂理宗御書華嚴法界正偏知閣等額梁貞明大鐵鍋存焉畫壁作五十三參等寺後菴宇甚幽大抵規模與靈隠相若故二寺號南北山之最東坡詩云卧聞禪老入南山浄掃風塵五百間其𢎞壯自昔已然今益侈大矣南山昭慶院惠照寺後為齋宫今歸浄慈南屏御園正對南屛又名翠芳南屏興教寺舊名善慶有齊雲亭清曠樓米元章書有琴臺及唐人磨崖八分家人卦中庸樂記篇後人於石傍刋右司馬温公書六字其實非也廣法院齊王功徳院有清曠亭法因院景獻太子殯所有古鐵塔錢王井寳林院莊文太子殯所舊名總持有可賦軒赤山殯宫舊瑞龍寺後為安穆成恭慈懿恭淑四后殯所今為熾盛光寺修吉寺舊瑞龍寺移於此有西湖竒艷正濟寺又名普門法雨寺舊名小心又改雲龍有趙清獻楊無為題名等安福尼寺極樂尼寺髙麗寺舊名惠因寺湖山間惟此寺無勅額元豐間髙麗王子僧統義天入貢學賢首教於此因施金建華嚴閣有易菴期懴堂皇姑成國公主殯所玉岑山惠因橋秦少㳺龍井紀逰所謂濯足於惠因澗即此廣果寺開化尼寺六通慈徳院舊名惠徳塔法興寺保福院長耳相院舊名法相定光菴有定光泉永慶院延長真如院延夀山浄梵院舊名瑞峰崇教院石屋洞大仁院有石菴天成石羅漢其洞後又一洞名蝙蝠洞水樂洞院名西闗浄化即滿覺院山孝宗時賜李隶慈明改賜楊郡王後歸賈平章山石竒秀中一洞嵌空有聲以此得名有聲在堂界堂愛此留照獨喜玉淵潄石宜晚上下四方之宇諸亭及金蓮池滿覺院舊名圓興今在水樂洞嶺傍石佛接待菴煙霞洞清修院有象鼻石佛手巖石羅漢東坡留題等歸雲菴寧宗時水菴清禪師坐禪石窟中聞南峰鐘鳴遂大悟今改永興菴闗真人道院小龍井井側有龍王祠南髙峰塔榮國寺有白龍祠五顯祠險峻甚於北峰中有墜石相傳云昔有道者鎮魔於此又有潁川泉方家峪自方家峪至冷水峪慈雲嶺泥路嘉㑹門外至大慈山龍山遇真道院悟真道院崇真道院廣教院號小南屛褒親崇夀寺在鳳凰山劉貴妃功徳有鳳凰泉瑞應泉松雲亭觀音洞筆架池偃松交枝檜三門有陳公儲畫龍甚竒弁陽翁詩云翟羽鸞綃事已空奉華遺寺對髙松宮斜鳳去無人見且㸔門前粉壁龍奉華劉妃閤名西蓮瑞相院黄貴妃功徳地藏尼寺慈光尼寺張府功徳廣慈院舊名廣福寳藏院有烏龍井錢武肅廟碑今錢氏五王廟在焉寜親廣福院陳淑妃香火院雖小而幽邃可喜福全尼寺廣嚴院舊名妙嚴有徐正節墓浄教院蔡貴妃殯所安福禪院内侍陳都知香火院名小陳寺水月寺路口有靈固石崇教院舊名薦福有珍珠泉華津洞趙兾王府園水石甚竒勝有仙人棊臺西林法惠院舊名興慶錢王建有雪齋秦少㳺記東坡詩冷水峪梯子嶺慈雲嶺浄明院郊壇齋宮有易安齋梅巖髙孝兩朝御和詩滿山皆椶櫚舊有江月菴舄亭龍華寳乗院本錢王瑞萼園捨建有傅大士塔并拍板門槌猶存有温公祠堂題名天華寺鏡清禪師道場舊名千春龍冊有頤軒妙因樓化生池感業寺舊名天龍有木觀音像勝相院舊名龍興千佛有五丈觀音像二并閣釋迦丈六金身像大通院舊名顯明天真院舊名登雲臺有靈化洞龍華山有石如龍與兩石龍寺接下石龍浄勝院上石龍永夀院舊名資賢石崖刻仁宗佛牙贊郊臺錢王郊臺亦近焉道林院舊名普濟大慈寺般若院寳惠院舊名普濟錢王墳文穆忠獻二王葬此長慶崇福院皇叔祖太師和王功徳窑池一名烏菱池真覺院舊名奉慶有東坡瑞香花詩包家山桃花闗桃花甚盛舊有蒸霞二字春日逰人甚多法雲寺舊名資崇大慈山舊有廣福金書院額虎跑泉舊傳性空禪師居此無泉二虎跑地而出東坡詩云虎移泉眼趂行脚龍作浪花供撫掌乾溪寨小楊寺香嚴寺小麥嶺飲馬橋前後至龍井止九溪十八澗道人山有石洞飲馬橋地名放馬場旌徳顯慶教寺咸淳甲戌冬改旌徳襲慶慈明太后香火方丈有軒曰雲扉後山有泉石甚竒曰林泉有清壑凝紫静雲等諸亭南山禪闗舊名龍井路今又改南天竺仰妃墓吴越錢王妃梅坡園楊郡王園又名總秀靈隠觀寜宗朝張知宮剏御書沖隠庵淳祐中道士范善遷重建賜名今額今菴在觀右而觀改仁夀院矣太清宮寧宗時朱靈寳守固建楊太后書道徳經石幢有嵗寒軒養性凝神二堂後為賈貴妃功徳今改觀音院松菴楊郡王府崇徳顯慶院舊名棲真章楶質夫功徳後為永王祈王殯所章司徒墓名得象樞使楶之祖棲真院碑可考翁五峰墓名孟寅字賔暘徐典樂墓名申字幹臣號青山翁强金紫墓名至字幾聖今石羊虎猶存其子文憲公淵明墓在西溪欽賢鄉諸子亦多附此陳拾遺墓唐人嵗久莫考名字在積慶山下氷壑書堂金樞宻淵號氷壑嘗作書堂於此因葬焉積慶永清二山在後平鼎山在左湖山在前凡錢塘城邑江湖之勝皆近在几席間乃南北二峰中之最髙一山也有君子天一二泉理宗御書積慶山怡顔藏書農圃以賜又賜功徳寺名曰積慶教忠後不及建而止贊寜塔天聖間葬此靈石山薛開封墓名居正諡貞顯崇因報徳院有靈石泉又名嵗寒泉甚清高宗嘗臨幸院與積慶山後永清院皆薛開府功徳此院已廢獨靈石塔猶存浄林廣福院開府楊慶菴祖墳土人呼為上楊庵有松闗南泉芳桂亭姜白石與恬樸翁等四人來逰詩云四人松下共盤桓筆硯花壺石上安今昔興懐同此味老仙留字在孱顔後為演福寺遂廢無垢寺舊名無著乃無著禪師道場舊在石人嶺慶元中韓平原以寺為生墳遂移寺於此嘉定十一年重修有鴉雞岩仙人臺清音軒偃松下有茯苓因名泉為茯苓泉後為演福寺遂廢崇恩演福教寺寳祐丁巳重建咸淳中改禪寺徳祐後復為教寺賈貴妃殯所周漢國端孝公主祔焉舊山門有妙莊嚴域及生清浄心亭真如亭諸天閣羅漢閣靈石堂雞籠山金鐘峰禇家坡漢末禇盛族舊有居此者白蓮院相傳晉肇法師講經於此風篁嶺小水樂福邸園二老亭後改徳威舊在風篁嶺頭東坡辯才往來於此皆有詩今移於龍井祠下龍井吴赤烏中葛稚川嘗煉丹於此在風篁嶺上巖壑林樾幽古石竇一泓清澈翠寒甘美可愛雖久旱不涸石上流水處其色如丹逰者視久水輒溢人去即減其深不可測相傳與江海通有龍居之毎禱雨必應或見小蟹斑魚蜥蜴之類井傍有惠濟龍王祠陳寺丞墓名剛中紹興中以言事與張狀元九成連坐謫知䖍州安逺縣而卒後葬風篁嶺沙盆塢胡侯墓名則知杭州廟在墓前劉菴孝宗朝劉婉容殯所今歸龍井寺龍井延恩衍慶寺辯才故地舊名報國㸔經院後改夀聖東坡書額猶存又改廣福元祐以來諸賢留題甚多及東坡竹石㢘宣仲枯朩寺前有過溪橋又名歸隠橋又名二老橋寺有方圓菴寂照閣清獻趙公閒堂訥齋潮音堂滌心沼鏡清堂沖泉薩埵石辯才清獻東坡三賢祠辯才塔諸天閣山有獅子峰葉苔磯墓元素字唐卿詩人五雲山中有真際院嶺上有天井大旱不竭九溪十八澗大麥嶺法空寺舊名資度南資聖院濮王墳花家山盧園内侍盧允昇園景物竒秀西湖十景所謂花港觀魚即此也浄安院内侍董宋臣香火崇真宮昔為女冠今為永浄尼寺茆家歩獨角門浄嚴廣報院内侍董永仲功徳隆興菴楊寺廨院黄泥嶺水陸菴楊寺廨院後名慶安院妙心寺水竹塢西湖三堤路蘇公堤自南新路直至北新路口小新堤自麴院至馬蝗橋蘇公堤元和中東坡守杭日所築起南迄北横截湖面夾道雜植花栁中為六橋九亭坡詩云六橋横絶天漢上北山始與南屏通忽驚二十五萬丈老葑席卷蒼烟空後守林希榜之曰蘇公堤章子厚詩云天面長虹一鑑痕直通南北兩山春第一橋港通赤山教場名映波旌徳觀元係定香寺舊址寳慶間京尹袁韶改建為觀有西湖道院虗舟雲錦二亭今復為定香寺先賢堂名仰髙祠許由以下共四十人刻石作贊具載事迹中以寳慶初巴陵之事謂潘閬有從秦王之嫌遂去之及節孝婦孫夫人以下五人今止三十有九人焉中有振衣古香清風堂山亭流芳花竹縈紆小山曲徑今歸旌徳堂宇皆廢第二橋通赤山麥嶺路名鎖瀾三賢堂祠白樂天林和靖蘇東坡後有三堂曰水西雲北月香水影晴光雨色後有小亭曰虗舟曰雲錦第三橋通花家山港名望山第四橋通茆家步港名壓堤北新路第三橋施水菴名圓通有石臺籠燈以照夜船雪江書堂胡賢良侊所居新水仙王廟龍王祠與葛嶺者為二崇真道院賈平章建後有閣今改為僧寺松窻張濡别墅第五橋通麴院港名東浦北新路第二橋第六橋通耿家步港名跨虹北新路第一橋小新堤淳祐中趙京尹與􅊸自北新路第二橋至麴院築堤以通靈竺之路中作四面堂三亭夾岸花栁比蘇堤或名趙公堤履泰將軍廟有天澤井葛仙翁所植虬松將軍錢塘人姓孫名顯