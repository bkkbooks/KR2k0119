堂度宗御書又有初陽精舍警室熙然臺無邊風月見天地心琳琅步歸舟等不一香月鄰廖瑩中園後歸賈相嘉德永夀教寺毛娘娘功德有翔泳堂芝巖喜鵲寺即禪宗院以鳥窠禪師得名魏婉儀殯所白樂天有紫楊花詩寶嚴院舊名垂雲有垂雲亭借竹軒無量福海趙紫芝墓名師秀在寶嚴院後定業院鳥窠禪師道場有君子泉石甑山環峰堂襲夢軒虎頭巖介於寶嚴定業之間施梅川墓名嶽字仲山吳人能詞精於律呂楊守齋為寺後樹梅作亭以葬薛梯飈為志李篔房書周草窗題蓋仁夀尼菴招賢寺上官良史墓在招賢寺後良史字季長號淇園報恩院舊名報先即孤山六一泉寺後以其地為延祥觀遂遷於此德國公主殯所廣化院舊名永福自孤山遷於此舊有白公竹閣柏堂水鑑堂涵暉亭凌雲閣金沙井辟支佛骨塔慧琳塔白公祠堂黃宜山詩云移自孤山占此山荒涼老屋萬琅玕櫻桃楊栁空花夢千古清風滿閣寒快活園趙氏水竹院落賈平章園御書閣曰奎文之閣有秋水觀第一春思剡亭道院顯明院舊名興福保清儀王仲湜殯所有鑑空閣緑淨堂北新路口棲霞嶺口古劍關棲霞嶺下嶽王墓嶽武穆王飛葬所其子雲亦祔焉葉靖逸詩云萬古知心只老天英雄堪恨復堪憐如公少緩須臾死彼運安能八十年漠漠凝塵空偃月堂堂遺像在凌煙早知埋骨西湖路悔不鴟夷理釣船林弓寮詩云天意只如此將軍足可傷忠無身報主寃有骨封王苔雨樓墻暗花風廟路香沈思百年事揮淚灑斜陽王修竹詩云埋骨西湖土一丘殘陽荒草幾經秋中原望斷因公死北客猶能説舊愁褒忠演福院元係智果觀音院後充嶽鄂王香火嶽雲所用鐵槍猶存沖虛宮舊名寧夀庵耿家步東山同口福夀院旌德寺子院有寧宗御書桂堂二字廖藥洲園有花香竹色心太平相在世綵愛君子習説等亭小石板巷口九里松一寺門唐刺史袁仁敬守杭日植松於左右各三行門扁吳説書髙宗嘗欲易之自以不及但金飾其字駝巘嶺口石板巷口麴院巷口行春橋小行春橋忠勇廟統制張玘祠左軍教場馬三寶墓在教場內曽欲去之有黑蜂數百自墓中出不可向遂止至元十五年六月內有軍厮名狗兒者因樵採墾土得一鐵劵上有字云鴈門馬氏葬於橫衝橋云云後又有十字至元十五六狗兒壞我屋蓋古人知數者耳始知行春橋本橫衝橋云三藏塔院明真宮女冠今改為三藏寺資德廟慕容貴妃香火萬夀院南山白雲宗建唐家同後澗溪紫芝道院道士陳崇真建瑞岡塢燕脂嶺以土色成名普福教寺崇夀院崇親資福院張淑妃香火天申萬夀圓覺教寺舊為了義法師塔院有歸雲堂三昧正受閣並髙宗御書纍朝臨幸有御座御榻理宗御書清涼覺地石獅子香林園斑衣園韓府金沙澗靈竺之水自此東入於湖顯慈集慶教寺閻貴妃香火寺殿閣扁皆理宗御書有月桂亭甚佳金碧為湖山諸寺之冠靈隱天竺寺門俗呼二寺門袁居中書白樂天詩一山門作兩山門兩寺元從一寺分正此也合澗橋靈竺二山之水會合於此龍春橋武林山又曰靈隱山又曰靈苑山又曰仙居山上有五峰曰飛來曰白猿曰稽留曰月桂曰蓮華山前有澗即武林泉也呼猿洞龍泓洞有蔣之竒篆字前後諸賢題字極多二洞在飛來峰女兒山一名玉女巖青林巖理公巖乃靈隱門山惠理法師在靈鷲寺後冷泉有亭在泉上冷泉二字乃白樂天書亭字乃東坡續書詩扁充棟不能悉録林丹山詩云一泓清可沁詩脾冷暖年來只自知流向西湖載歌舞回頭不似在山時溫泉醴泉二泉在冷泉之上葛塢朱墅候仙亭壑雷亭觀風亭又有虗白見山袁君紫薇翠微石橋月桂等亭及丹竈隱居許邁思真三堂連巖棧伏龍濺等今皆廢景德靈隱禪寺相傳靈隱禪寺乃葛仙翁書或云宋之問書景德中續加景德二字有百尺彌勒閣蓮峰堂方丈曰直指堂千佛殿延賔水閣望海閣理宗御書覺王寶殿妙莊嚴域又有巢雲亭見山堂白雲菴松源菴東菴等在山後尤幽寂可喜北髙峰塔在靈隱寺山後絶頂比南髙峰尤髙上有五顯祠逺近炷香四時不絶法安院舊名廣嚴唐韜光禪師築菴於院後有清獻東坡題名保寧院舊名保安無量夀資聖院舊名大明開山咸澤禪師韜光菴韜光禪師道場與樂天同時周伯弜有詩前後諸賢留題甚多舊有僧嘗於此降仙請至釋子蘭以下十人凡七士三釋皆唐人能詩者各書一詩語極竒絶曲盡其景今詩尚存壁間永福寺隆國黃夫人功德咸淳九年建在靈隱西石筍山下石筍普圓院天福二年黃氏重修舊名資嚴山有石如筍髙數十丈故名石筍寺有超然臺金沙白沙二泉鄴公菴杭守祖無擇愛此山之勝結菴於此取公所封名之方丈左右金漆板扉皆趙清獻諸賢蘇秦陳黃留題及文與可竹數枝如張總得父子吳傳朋等題字甚多嵗久暗淡猶隱隱可見寺極清古幽邃為湖山諸剎之冠後隆國黃夫人以超然臺為葬地遂移此院於山之西而古意不復存矣天聖靈夀院僧德賢建鐵舌菴隆親永福院溫國陳夫人香火今廢時思薦福寺吳益王墳寺舊以下竺為墳寺後以古剎遂别建於此髙宗嘗臨幸吳太后手書金剛經有楊太后跋及髙宗御書心經並刻石藏下竺靈山塔下益王神道碑蔣燦書甚佳墓前二石馬琢刻如生舊傳夜輒馳驟其鞦轡光瑩如玉至今苔蘚不侵寺有宜對亭通雲亭雙珠亭萬玉軒湖山至此極幽邃矣黃妃墓錢王妃卓筆峰明惠尼院舊名定惠錢王孫妃香火石人嶺海峰菴無著禪師塔舊有無垢院韓平原以為夀地遷院於靈石山側後楊郡王復取為夀地遂啓其塔乃陶龕容色如生髮垂至肩指瓜皆繞身舍利無數留三日不壞竟荼毗之僧肇淮海有詩云一定空山五百年不須惆悵啓頽甎路邊多少麒麟冢過眼無人贈紙錢今地為永福所有西溪路畢宫師墓畢再遇之父子皆葬於此三天竺自靈鷲至上竺郎當嶺止陳明大王廟漢靈帝熹平餘杭令陳渾後唐明宗長興中封太平靈衛王靈鷲興聖寺惠理法師卓錫之地吳越王建有靈山海會閣理宗御書理公巖滴翠軒九品觀東坡詞東坡題名隋觀法師塔下竺開山祖師真觀下天竺靈山教寺在隋號南天竺五代時號五百羅漢院祥符初號靈山天禧復名天竺寺紹興改賜天竺時思薦福為吳秦王香火慶元復今額有御書閣藏仁宗及中興五朝御書曲水亭前塔跳珠泉枕流亭適安亭清暉亭九品觀堂石面靈桃石蓮華水波石悟侍者塔並祠草堂西嶺卧龍石石門澗神尼舍利塔日觀菴方丈曰佛國山法堂二字乃雲房鍾離權書甚竒古金光明三昧堂神御殿瑞光塔普賢殿無量夀閣回軒亭七葉堂客兒亭大悲泉重榮檜葛仙丹井白少傅烹茶井石梁翻經臺望海閣香林亭香林洞無根藤鬬雞巖夜講堂登嘯亭靈山後塔慈雲懴主塔七寶普賢閣旃檀觀音瑞像有記大抵靈竺之勝周回數十里巖壑尤美實聚於下天竺寺自飛來峰轉至寺後諸巖洞皆嵌空玲瓏瑩滑清潤如虬龍瑞鳳如層華吐萼如皺縠疊浪穿幽透深不可名貌林朩皆自巖骨拔起不土而生傳言兹巖韞玉故腴潤若此石間波紋水迹亦不知何時有之其間唐宋逰人題名不可殫記覽者顧景興懷云吳越孝獻世子墓文穆王子楓林塢永清寺薛開府居正香火中天竺天寧萬夀永祚禪寺隋開皇千嵗寶掌和尚開山建寺吳越時名崇夀院政和中改賜今名有摩利支天像華嚴閣如意泉彌陀興福教院皇子兖邠二王殯所大明寺元係興國菴顯親多福院舊名先福上天竺靈感觀音院天福中建名天竺看經院咸平初賜今名淳祐中賜廣大靈感觀音教寺舊寺額蔡襄書後理宗易以御書外山門乃蔡京書紹興乾道淳熙皆嘗臨幸有十六觀堂應真閣超諸有海理宗御書有雲漢之閣藏纍朝所賜御書兩峰堂白雲堂中印堂清華軒延桂閣秋芳閣伴雲閣前後賜珠冠玉爐珍玩甚多每水旱朝廷必禱焉外古迹有肅儀亭梅峰菴崇老橋金佛橋復菴流虹澗夢泉植杖亭謝履亭凝翠泉觀音泉雲液池孫公泉無竭泉雙檜峰白雲峰乳竇峰楊梅嶺郎當嶺武林舊事卷五
